    web: |
      <b>📖 Necə işləyir</b>

      1. /new — paket yarat
      2. Foto, video, GIF və ya stiker göndər — hətta bütöv albom
      3. /packs — paketlərin və onların parametrləri

      Bələdçilər, məsləhətlər və FAQ saytdadır.
    menu: |
      <b>❓ Kömək</b>

      Mövzu seç:
    create: |
      <b>🎨 Stiker yaratmaq</b>

      1. Paket yaratmaq üçün /new göndər
      2. Növü seç: adi, video və ya emoji
      3. Foto, video və ya GIF göndər
      4. Hazırdır! Bot hər şeyi özü çevirir

      <b>Faydalı əmrlər:</b>
      • /clear — fotodan fonu sil
      • /round — videodan dairəvi video mesaj düzəlt
      • /frame — video stikerin forması:
        └ lite, medium, rounded, square, circle

      <b>💡 Məsləhət:</b> Şəffaflığı qorumaq üçün PNG-ni <b>Fayl</b> kimi (📎) göndər. «Foto» rejimi şəkli sıxır və şəffaflığı silir.
    manage: |
      <b>📁 Paketləri idarə etmək</b>

      <b>Əmrlər:</b>
      • /packs — paketlərinin siyahısı
      • /delete — stikeri sil
      • /copy — paketi kopyala
      • /restore — gizli paketləri bərpa et
      • /original — stikerin orijinalını tap
      • /about — paket və müəllif haqqında məlumat

      <b>Emojini dəyiş:</b>
      Stikeri göndər → yeni emojini göndər.
      Və ya stikeri əlavə etdikdən dərhal sonra emoji göndər.

      <b>Standart emoji:</b>
      /emoji 🔥 — bütün yeni stikerlər bu emojini alacaq.

      <b>Qruplarda:</b>
      /ss (mediaya cavab olaraq) — qrup paketinə tez əlavə et.

      <b>Inline paketlər:</b>
      Şəxsi kolleksiyan: saxlanılmış stiker, GIF, foto və videoları istənilən söhbətdə göndər — @bot_adı yaz və lazım olanı seç.
      • Telegram stikerlərinə heç nə əlavə olunmur — hər şey botda saxlanılır
      • Stiker, foto, GIF və video saxlaya bilər
      • /packs → «Inline» bölməsində yarat
      • Həmçinin GIF axtarışı rejimi var (Tenor vasitəsilə)

      <b>Birgə redaktə:</b>
      Paketə toxun → «Birgə redaktə» → link al.
      Linki olan hər kəs stiker əlavə edə və silə bilər.
      Bütün redaktorları çıxarmaq üçün linki sıfırla.

      <b>Paket parametrləri:</b>
      /packs bölməsində paketə toxun → adını dəyiş, Boost, birgə redaktə, sil.
    catalog: |
      <b>🔍 Kataloq</b>

      • /catalog — populyar paketlər
      • /publish — öz paketini dərc et
      • Yaxşı paketləri önə çıxarmaq üçün qiymətləndir
    boost: |
      <b>⚡ Boost</b>

      • Adda "${titleSuffix}" olmur
      • Videolar prioritetlə emal olunur
      • 35 saniyəyə qədər video
      • Eyni anda bir neçə stiker

      <b>🎨 Adaptiv emoji</b> — /new-da ayrıca paket növü: emojilər mətnin rənginə uyğunlaşır

      Əldə et → /donate
    problems: |
      <b>❓ FAQ</b>

      <b>⚫ Fon qara oldu?</b>
      «Foto» kimi göndərdikdə Telegram şəffaflığı silir.
      → PNG-ni <b>Fayl</b> kimi göndər (📎 sancaq).

      <b>🔄 Dəyişikliklər görünmür?</b>
      Telegram stikerləri keşdə saxlayır. ~1 saat gözlə və ya tətbiqi yenidən başlat.

      <b>📹 Video hərəkət etmir?</b>
      Çox güman ki, format qeyri-adidir. MP4-ə çevirməyə çalış və ya Video əvəzinə Fayl kimi göndər.

      <b>🗑 Stikeri necə silmək olar?</b>
      /delete göndər, sonra stikerə toxun.

      <b>🤏 Stiker çox kiçikdir?</b>
      Göndərməzdən əvvəl şəkli kvadrat (1:1) formasında kəs.

      <b>🔗 Linkdən "_by_fStikBot" necə silinir?</b>
      Heç cür. Telegram paketin hansı botla yaradıldığını bilmək üçün bu şəkilçini tələb edir. Bu bizim deyil, platformanın qaydasıdır.

      <b>💎 Premium lazımdır?</b>
      • Paket yaratmaq: pulsuz
      • Stikerlərdən istifadə: pulsuz
      • Fərdi emoji göndərmək: yalnız Premium (Telegram qaydası)

      <b>Başqa sualın var?</b> @fStikCommunity
