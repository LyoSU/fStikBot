    İmkanlar:
    • Paketlərin idarə olunması
    • Video stikerlər və fərdi emojilər
    • Orijinal faylların yüklənməsi
    • Stiker/video/GIF-in şəklə çevrilməsi
    • Stiker kataloqu

    Stiker axtarışı: play.google.com/store/apps/details?id=app.fstik 🇺🇦
