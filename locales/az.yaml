    create: |
      <b>🎨 Stikerlərin yaradılması</b>

      1. Paket yaratmaq üçün /new göndərin
      2. Növü seçin: adi, video və ya emoji
      3. Foto, video və ya GIF göndərin
      4. Hazırdır! Bot hər şeyi özü çevirir

      <b>Faydalı əmrlər:</b>
      • /clear — fotodan fonu silmək
      • /round — videodan dairəvi video düzəltmək
      • /frame — video stikerin forması:
        └ lite, medium, rounded, square, circle

      <b>💡 Məsləhət:</b> Şəffaflığı qorumaq üçün PNG-ni <b>Fayl</b> kimi (📎) göndərin. «Foto» rejimi şəkli sıxır və şəffaflığı silir.
    manage: |
      <b>📁 Paketlərin idarə olunması</b>

      <b>Əmrlər:</b>
      • /packs — paketlərinizin siyahısı
      • /delete — stikeri silmək
      • /copy — paketi kopyalamaq
      • /restore — gizlədilmiş paketləri qaytarmaq
      • /original — stikerin orijinalını tapmaq
      • /about — paket və müəllif haqqında məlumat

      <b>Emojini dəyişmək:</b>
      Stikeri göndərin → yeni emojini göndərin.
      Və ya stikeri əlavə etdikdən dərhal sonra emoji göndərin.

      <b>Standart emoji:</b>
      /emoji 🔥 — bütün yeni stikerlər bu emojini alacaq.

      <b>Qruplarda:</b>
      /ss (mediaya cavab olaraq) — qrup paketinə tez əlavə etmək.

      <b>İnline paketlər:</b>
      Şəxsi kolleksiyanız: saxlanılmış stiker, GIF, foto və videoları istənilən söhbətdə göndərin — @bot_adı yazın və lazım olanı seçin.
      • Telegram stikerlərinə heç nə əlavə olunmur — hər şey botda saxlanılır
      • Stiker, foto, GIF və video saxlaya bilər
      • /packs → «İnline» bölməsində yaradın
      • GIF axtarışı rejimi də var (Tenor vasitəsilə)

      <b>Birgə redaktə:</b>
      Paketə toxunun → «Birgə redaktə» → link alın.
      Linki olan hər kəs stiker əlavə edə və silə bilər.
      Bütün redaktorları çıxarmaq üçün linki sıfırlayın.

      <b>Paket ayarları:</b>
      /packs-da paketə toxunun → adını dəyişmək, gücləndirmə, birgə redaktə, silmək.
    catalog: |
