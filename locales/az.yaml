      <b>🎨 Adaptiv emojilər</b> — /new-da ayrıca paket növü: emojilər mətnin rənginə uyğunlaşır

      Əldə etmək → /donate
    problems: |
      <b>❓ FAQ</b>

      <b>⚫ Fon qara oldu?</b>
      «Foto» kimi göndərdikdə Telegram şəffaflığı silir.
      → PNG-ni <b>Fayl</b> kimi göndərin (📎 ikonu).

      <b>🔄 Dəyişikliklər görünmür?</b>
      Telegram stikerləri keşdə saxlayır. ~1 saat gözləyin və ya tətbiqi yenidən başladın.

      <b>📹 Video hərəkət etmir?</b>
      Çox güman ki, format qeyri-adidir. MP4-ə çevirməyə çalışın və ya Video əvəzinə Fayl kimi göndərin.

      <b>🗑 Stikeri necə silmək olar?</b>
      /delete göndərin, sonra stikerə toxunun.

      <b>🤏 Stiker çox kiçikdir?</b>
      Göndərməzdən əvvəl şəkli kvadrat (1:1) formada kəsin.

      <b>🔗 Linkdən "_by_fStikBot" necə silinir?</b>
      Heç cür. Telegram paketin hansı botla yaradıldığını müəyyən etmək üçün bu sonluğu tələb edir. Bu, bizim deyil, platformanın qaydasıdır.

      <b>💎 Premium lazımdır?</b>
      • Paket yaratmaq: pulsuz
      • Stikerlərdən istifadə: pulsuz
      • Fərdi emoji göndərmək: yalnız Premium (Telegram qaydası)

