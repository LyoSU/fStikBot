  guide:
    web: |
      <b>📖 How to use fStikBot</b>

      Full guides, tips, and FAQ on our website.
    menu: |
      <b>❓ Help</b>

      Choose a topic:
    create: |
      <b>🎨 Creating stickers</b>

      1. Send /new to create a pack
      2. Choose a type: regular, video, or emoji
      3. Send photos, videos, or GIFs
      4. Done! The bot converts everything itself

      <b>Useful commands:</b>
      • /clear — remove background from a photo
      • /round — turn a video into a video message (circle)
      • /frame — video sticker shape:
        └ lite, medium, rounded, square, circle

      <b>💡 Tip:</b> Send PNG as a <b>File</b> (📎) to keep transparency. "Photo" mode compresses it and removes transparency.
    manage: |
      <b>📁 Managing packs</b>

      <b>Commands:</b>
      • /packs — list of your packs
      • /delete — delete a sticker
      • /copy — copy a pack
      • /restore — bring back hidden packs
      • /original — find a sticker's original
      • /about — pack and creator info

      <b>Change emoji:</b>
      Send a sticker → send the new emoji.
      Or send an emoji right after adding.

      <b>Default emoji:</b>
      /emoji 🔥 — all new stickers will get this one.

      <b>In groups:</b>
      /ss (in reply to media) — quick add to the group pack.

      <b>Inline packs:</b>
      Your personal collection: send saved stickers, GIFs, photos and videos in any chat — type @botname and pick what you need.
      • Nothing is added to your Telegram stickers — everything is stored in the bot
      • Can contain stickers, photos, GIFs, videos
      • Create one in /packs → "Inline" tab
      • Also has a GIF search mode (via Tenor)

      <b>Co-editing (Co-edit):</b>
      Tap a pack → Co-edit → get a link.
      Anyone with the link can add/delete stickers.
      Reset the link to remove all editors.

      <b>Pack options:</b>
      Tap a pack in /packs → rename, boost, co-edit, delete.
    catalog: |
      <b>🔍 Catalog</b>

      • /catalog — popular packs
      • /publish — publish your pack
      • Rate packs to promote great ones
    boost: |
      <b>⚡ Boost</b>

      • No "${titleSuffix}" in the title
      • Priority video processing
      • Videos up to 35 sec
      • Multiple stickers at once

      <b>🎨 Adaptive emoji</b> — a separate pack type in /new: the emoji change color to match the text

      Get it → /donate
    problems: |
      <b>❓ FAQ</b>

      <b>⚫ Background turned black?</b>
      Telegram removes transparency if you send it as a "Photo".
      → Send PNG as a <b>File</b> (📎 paperclip).

      <b>🔄 Changes not showing?</b>
      Telegram caches stickers. Wait ~1 hour or restart the app.

      <b>📹 Video not animating?</b>
      Most likely an unusual format. Try converting to MP4 or send it as a File instead of a Video.

      <b>🗑 How do I delete a sticker?</b>
      Send /delete, then tap the sticker.

      <b>🤏 Sticker too small?</b>
      Crop the image to a square (1:1) before sending.

      <b>🔗 How do I remove "_by_fStikBot" from the link?</b>
      You can't. Telegram requires this suffix to identify which bot created the pack. It's a platform rule, not ours.

      <b>💎 Do I need Premium?</b>
      • Creating packs: free
      • Using stickers: free
      • Sending custom emoji: Premium only (Telegram rule)

      <b>More questions?</b> @fStikCommunity
