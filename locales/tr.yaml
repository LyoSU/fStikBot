language_name: '🇹🇷 Türkçe'
name: fStik — Çıkartmalar ve İfadeler
description:
  long: |
    Fotoğraf, video ve GIF'lerden çıkartma ve ifade oluştur. Elle dönüştürmeye gerek yok — bot her şeyi kendisi halleder. @Stickers'tan daha kolay.

    Özellikler:
    • Paket yönetimi
    • Video çıkartmalar ve özel ifadeler
    • Orijinal dosyaları indirme
    • Çıkartma/video/GIF'i görsele dönüştürme
    • Çıkartma kataloğu

    Çıkartma ara: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Fotoğraf, video ve GIF'lerden çıkartma ve ifade oluştur. Çıkartma kataloğu ve arama. 🇺🇦
ratelimit: Biraz yavaşla!
