---
language_name: '🇹🇷 Türkçe'
name: fStik — Çıkartmalar ve Emoji
description:
  long: |
    Fotoğraf, video ve GIF'lerden çıkartma ve emoji oluştur. Elle dönüştürmeye gerek yok — bot her şeyi kendisi halleder. @Stickers'tan daha kolay.

    Özellikler:
    • Paket yönetimi
    • Video çıkartmalar ve özel emojiler
    • Orijinal dosyaları indirme
    • Çıkartma/video/GIF'i resme dönüştürme
    • Çıkartma kataloğu

    Çıkartma ara: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Fotoğraf, video ve GIF'lerden çıkartma ve emoji oluştur. Çıkartma kataloğu ve arama. 🇺🇦
ratelimit: Çok sık!
