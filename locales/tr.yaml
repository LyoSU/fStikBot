      Merhaba, ${groupTitle}! Çıkartma ve emoji oluşturuyorum.

      Grup paketine çıkartma eklemek için bir fotoğraf, video, GIF veya çıkartmaya yanıt olarak /ss kullan.
    catalog: |
      <b>🔍 Çıkartma Kataloğu</b>

      Paketleri anahtar kelimelerle ara veya popüler olanlara göz at.
      Harika paketleri başkalarının da bulabilmesi için puan ver.
    search_catalog: |
      <b>🌐 Paket kataloğu</b>

      Başkalarının paketlerine göz at veya kendi paketlerini yayınla:
