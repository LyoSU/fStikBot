      catalog_app_mini: '📱 Android uygulaması'
  guide:
    web: |
      <b>📖 fStikBot nasıl kullanılır</b>

      Ayrıntılı rehberler, ipuçları ve SSS web sitemizde.
    menu: |
      <b>❓ Yardım</b>

      Bir konu seç:
    create: |
      <b>🎨 Çıkartma oluşturma</b>

      1. Paket oluşturmak için /new gönder
      2. Türü seç: normal, video veya emoji
      3. Fotoğraf, video veya GIF gönder
      4. Hepsi bu! Bot her şeyi kendisi dönüştürür

      <b>Faydalı komutlar:</b>
      • /clear — fotoğrafın arka planını kaldır
      • /round — videodan yuvarlak video yap
      • /frame — video çıkartmanın şekli:
        └ lite, medium, rounded, square, circle

      <b>💡 İpucu:</b> Şeffaflığı korumak için PNG'yi <b>Dosya</b> (📎) olarak gönder. "Fotoğraf" modu görseli sıkıştırır ve şeffaflığı kaldırır.
    manage: |
      <b>📁 Paket yönetimi</b>

      <b>Komutlar:</b>
      • /packs — paketlerinin listesi
      • /delete — çıkartma sil
      • /copy — paketi kopyala
      • /restore — gizlenen paketleri geri getir
      • /original — çıkartmanın orijinalini bul
      • /about — paket ve yaratıcısı hakkında bilgi

      <b>Emojiyi değiştirme:</b>
      Çıkartmayı gönder → yeni emojiyi gönder.
      Ya da ekledikten hemen sonra emojiyi gönder.

      <b>Varsayılan emoji:</b>
      /emoji 🔥 — tüm yeni çıkartmalar bu emojiyi alır.

      <b>Gruplarda:</b>
      /ss (bir medyaya yanıt olarak) — grup paketine hızlıca ekle.

      <b>Satır içi paketler:</b>
      Herhangi bir sohbette @bot_adı ile hızlı erişim için ayrı bir paket türü.
      • Gerçek bir Telegram paketi değil — yalnızca botta saklanır
      • Çıkartma, fotoğraf, GIF ve video içerebilir
      • /packs → "Satır içi" sekmesinden oluştur
      • GIF arama modu da var (Tenor üzerinden)

      <b>Ortak düzenleme:</b>
      Pakete dokun → Ortak düzenleme → bağlantıyı al.
      Bağlantıya sahip herkes çıkartma ekleyip silebilir.
      Tüm editörleri kaldırmak için bağlantıyı sıfırla.

      <b>Paket seçenekleri:</b>
      /packs içinde bir pakete dokun → yeniden adlandır, takviye et, ortak düzenleme, sil.
    catalog: |
      <b>🔍 Katalog</b>

      • /catalog — popüler paketler
      • /publish — kendi paketini yayınla
      • Harika paketleri öne çıkarmak için puan ver
    boost: |
      <b>⚡ Takviye</b>

      • Adda "${titleSuffix}" eki olmaz
      • Videolar öncelikli işlenir
      • 30 saniyeye kadar videolar
      • Kuyruğa birden fazla çıkartma

      <b>Uyarlanabilir emoji</b> — /new içinde ayrı bir düğme (rengi metne uyum sağlar)

      Almak için → /donate
    problems: |
      <b>❓ SSS</b>

      <b>⚫ Arka plan siyah mı oldu?</b>
      "Fotoğraf" olarak gönderdiğinde Telegram şeffaflığı kaldırır.
      → PNG'yi <b>Dosya</b> (📎 ataç simgesi) olarak gönder.

      <b>🔄 Değişiklikler görünmüyor mu?</b>
      Telegram çıkartmaları önbelleğe alır. ~1 saat bekle veya uygulamayı yeniden başlat.

      <b>📹 Video oynamıyor mu?</b>
      Muhtemelen alışılmadık bir format. MP4'e dönüştürmeyi dene ya da Video yerine Dosya olarak gönder.

      <b>🗑 Çıkartma nasıl silinir?</b>
      /delete gönder, ardından çıkartmaya dokun.

      <b>🤏 Çıkartma çok mu küçük?</b>
      Göndermeden önce görseli kare (1:1) olacak şekilde kırp.

      <b>🔗 Bağlantıdaki "_by_fStikBot" nasıl kaldırılır?</b>
      Kaldırılamaz. Telegram, paketi hangi botun oluşturduğunu belirlemek için bu eki zorunlu tutar. Bu bizim değil, platformun kuralı.

      <b>💎 Premium gerekli mi?</b>
      • Paket oluşturmak: ücretsiz
      • Çıkartma kullanmak: ücretsiz
      • Özel emoji göndermek: yalnızca Premium (Telegram kuralı)

      <b>Başka sorun mu var?</b> @fStikCommunity
