---
language_name: '🇷🇺 Русский'
name: fStik — Стикеры и эмодзи
description:
  long: |
    Создавай стикеры и эмодзи из фото, видео и GIF. Без ручной конвертации — бот сделает всё сам. Проще, чем @Stickers.

    Возможности:
    • Управление наборами
    • Видеостикеры и авторские эмодзи
    • Скачивание оригиналов
    • Конвертация стикера/видео/GIF в картинку
    • Каталог стикеров

    Поиск стикеров: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Создавай стикеры и эмодзи из фото, видео, GIF. Каталог и поиск стикеров. 🇺🇦
ratelimit: Слишком часто!
cmd:
  start:
    enter: |
      Привет, ${name}!
      Создаю стикеры и эмодзи из фото, видео и GIF.

      💬 @fStikCommunityRU
    group: |
      Привет, ${groupTitle}! Я создаю стикеры и эмодзи.

      Чтобы добавить стикер в набор группы, используй /ss в ответ на фото, видео, GIF или стикер.
    catalog: |
      <b>🔍 Каталог стикеров</b>

      Ищи наборы по ключевым словам или смотри популярные.
      Оценивай наборы, чтобы помочь другим найти классные.
    search_catalog: |
      <b>🌐 Каталог наборов</b>

      Смотри наборы других пользователей или публикуй свои:
    commands:
      ss: '➕ Добавить в набор группы'
      start: '📜 Меню'
      help: '❓ Помощь'
      packs: '📁 Мои наборы'
      new: '➕ Новый набор'
      search_catalog: '🌐 Каталог'
