      lang: '🌐 Язык'
      report: '🚨 Жалоба'
      donate: '⭐ Поддержать'
      add_to_group: '👥 Добавить в группу'
      privacy: '🔒 Приватность'
      guide: '❓ Помощь'
    btn:
      new: '➕ Новый набор'
      catalog: '🔍 Каталог'
      catalog_mini: '🔍 Каталог'
      catalog_browser: '🌐 Открыть в браузере'
      catalog_browser_mini: '🌐 В браузере'
      catalog_app: '📱 Скачать на Android'
      catalog_app_mini: '📱 Для Android'
    current_pack: '📦 Стикеры добавляются в: <a href="${link}">${title}</a>'
    hint: 'Отправь фото, видео, GIF или стикер — добавлю в <a href="${link}">${title}</a>.'
  guide:
    web: |
      <b>📖 Как это работает</b>

      1. /new — создай набор
      2. Отправляй фото, видео, GIF или стикеры — можно даже целым альбомом
      3. /packs — твои наборы и их настройки

      Гайды, советы и FAQ — на сайте.
    menu: |
      <b>❓ Помощь</b>

      Выбери тему:
    create: |
      <b>🎨 Создание стикеров</b>

      1. Отправь /new, чтобы создать набор
      2. Выбери тип: обычный, видео или эмодзи
      3. Отправь фото, видео или GIF
      4. Готово! Бот сам всё сконвертирует

      <b>Полезные команды:</b>
      • /clear — удалить фон с фото
      • /round — сделать кружок из видео
      • /frame — форма видеостикера:
        └ lite, medium, rounded, square, circle

      <b>💡 Совет:</b> Отправляй PNG как <b>Файл</b> (📎), чтобы сохранить прозрачность. Режим «Фото» сжимает картинку и убирает её.
    manage: |
      <b>📁 Управление наборами</b>

      <b>Команды:</b>
      • /packs — список твоих наборов
      • /delete — удалить стикер
      • /copy — скопировать набор
      • /restore — вернуть скрытые наборы
      • /original — найти оригинал стикера
      • /about — инфо о наборе и авторе

      <b>Изменить эмодзи:</b>
      Отправь стикер → отправь новый эмодзи.
      Или отправь эмодзи сразу после добавления.

      <b>Эмодзи по умолчанию:</b>
      /emoji 🔥 — все новые стикеры получат этот эмодзи.

      <b>В группах:</b>
      /ss (в ответ на медиа) — быстрое добавление в набор группы.

      <b>Инлайн-наборы:</b>
      Твоя личная коллекция: отправляй сохранённые стикеры, GIF, фото и видео в любом чате — напиши @имя_бота и выбери нужное.
      • В стикеры Telegram ничего не добавляется — всё хранится в боте
      • Может содержать стикеры, фото, GIF, видео
      • Создай в /packs → вкладка «Инлайн»
      • Также есть режим поиска GIF (через Tenor)

      <b>Совместный доступ:</b>
      Нажми на набор → «Совместный доступ» → получи ссылку.
      Любой, у кого есть ссылка, может добавлять и удалять стикеры.
      Сбрось ссылку, чтобы закрыть доступ.

      <b>Опции набора:</b>
      Нажми на набор в /packs → переименовать, буст, совместный доступ, удалить.
    catalog: |
      <b>🔍 Каталог</b>

      • /catalog — популярные наборы
      • /publish — опубликовать свой набор
      • Оценивай наборы, чтобы продвигать классные
    boost: |
      <b>⚡ Буст</b>

      • Без "${titleSuffix}" в названии
      • Приоритетная обработка видео
      • Видео до 35 сек
      • Несколько стикеров одновременно

      <b>🎨 Адаптивные эмодзи</b> — отдельный тип набора в /new: эмодзи меняют цвет под текст

      Получить → /donate
    problems: |
      <b>❓ FAQ</b>

      <b>⚫ Фон стал чёрным?</b>
      Telegram убирает прозрачность, если отправить как «Фото».
      → Отправляй PNG как <b>Файл</b> (📎 скрепка).

      <b>🔄 Изменения не видны?</b>
      Telegram кеширует стикеры. Подожди около часа или перезапусти приложение.

      <b>📹 Видео не анимируется?</b>
      Скорее всего, необычный формат. Попробуй сконвертировать в MP4 или отправить как файл вместо видео.

      <b>🗑 Как удалить стикер?</b>
      Отправь /delete, потом нажми на стикер.

      <b>🤏 Стикер слишком маленький?</b>
      Обрежь картинку до квадрата (1:1) перед отправкой.

      <b>🔗 Как убрать "_by_fStikBot" из ссылки?</b>
      Никак. Telegram требует этот суффикс, чтобы определить, каким ботом создан набор. Это правило платформы, а не наше.

      <b>💎 Нужен Premium?</b>
      • Создавать наборы: бесплатно
      • Использовать стикеры: бесплатно
      • Отправлять авторские эмодзи: только с Premium (правило Telegram)

      <b>Ещё вопросы?</b> @fStikCommunityRU
    btn:
      open: '📖 Открыть гайд'
      create: '🎨 Создание стикеров'
      manage: '📁 Управление наборами'
