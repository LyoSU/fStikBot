      Commençons par créer un nouveau pack pour la copie.
    progress: |
      ⏳ Copie : ${current}/${total}
    done: |
      ✅ Copié dans <a href="${link}">${title}</a>
    done_partial: |
      ⚠️ Copié dans <a href="${link}">${title}</a>

      ${success} stickers copiés, ${failed} n'ont pas pu être copiés.
    done_pending: |
      ✅ Copié dans <a href="${link}">${title}</a>

      ${success} stickers copiés, ${pending} vidéos encore en cours de traitement.
    done_partial_pending: |
      ⚠️ Copié dans <a href="${link}">${title}</a>

      ${success} stickers copiés, ${failed} échecs, ${pending} vidéos encore en cours de traitement.
    pay: |
      <b>Conversion de pack</b>

      Convertir un pack d'un type à un autre coûte 1 crédit

      <b>Solde actuel :</b> ${balance} crédits

      Acheter des crédits : /donate
    pay_btn: '✅ Confirmer'
    error:
      all_failed: |
        ❌ Aucun sticker n'a pu être copié depuis <a href="${originalLink}">${originalTitle}</a>.

        Le pack n'a pas été créé.
      premium: |
        Désolé, cette fonctionnalité est réservée à celles et ceux qui ont soutenu le bot.

        Tu peux le faire en envoyant la commande /donate.
  original:
    enter: |
      <b>🔎 Origine du sticker</b>

      Envoie un sticker — je te montre de quel pack il a été copié.
      Si l'original est introuvable, tu recevras le fichier (PNG/WEBM).
    source_found: |
      🔎 Copié depuis : <a href="${link}">${title}</a>
    error:
      not_found: |
        Original introuvable. Voici le fichier du sticker :
  delete:
    enter: |
      <b>🗑 Suppression d'un sticker</b>

      Envoie le sticker que tu veux supprimer du pack.
    confirm: |
      Supprimer ce sticker du pack ?
    error:
      not_found: |
        Sticker introuvable dans la base. Il n'a peut-être pas été créé avec ce bot.
  rename:
    enter_name: |
      Nouveau titre pour <a href="${link}">${title}</a> :
    success: |
      ✅ Renommé : <a href="${link}">${title}</a>
    boost_notice: |
      Le boost retire « ${titleSuffix} » → /donate
  packAbout:
    enter: |
      <b>🔎 À qui est ce sticker</b>

      Envoie un sticker — je te montre le pack, son auteur et ses autres packs.
      Ou transfère un message — je te montre les packs de cette personne.
    not_found: |
      Sticker introuvable.
    btn:
      download: '📎 Télécharger le fichier'
      show_all_packs: '📦 Tous les packs (${count})'
    result: |
      <b>📦 Pack :</b> <a href="${link}">${name}</a>
      🔢 Stickers : <code>${stickerCount}</code> | 🏷 #<code>${setId}</code> | ${dcId}

      🧑‍🎨 ID du propriétaire : <code>${ownerId}</code>
      ${mention}

      <b>🎨 Autres packs de ce propriétaire :</b>
      ${otherPacks}
    no_other_packs: |
      <i>Nous n'avons aucune information sur d'autres packs de ce propriétaire</i>
    unknown_owner: '<i>Inconnu</i>'
    hidden: '<i>[masqué]</i>'
  boost:
    sure: |
      Booster <a href="${link}">${title}</a> ?

      <b>Prix :</b> 1 crédit
      <b>Solde :</b> ${balance}
    btn:
      yes: '⚡ Booster'
      no: Annuler
    canceled: |
      Annulé
    success: |
      ⚡ <a href="${link}">${title}</a> — boost activé !

      <b>Débloqué :</b>
      • Titre sans le suffixe « ${titleSuffix} » — après avoir renommé le pack
      • Jusqu'à 64 caractères dans le titre (au lieu de 35)
      • Vidéos jusqu'à 35 secondes
      • Priorité de conversion
      • Plusieurs stickers à la fois

      <i>Pour retirer le suffixe, appuie sur « ✏️ Renommer » dans le menu du pack.</i>
    error:
      too_fast: Pas si vite — réessaie dans une seconde.
      not_enough_credits: |
        Pas assez de crédits. /donate
      already_boosted: |
        Déjà boosté.
  catalog:
    publish:
      publish_new: |
        👌 <b>Envoie un sticker du pack que tu veux publier</b>

        <i>Tu peux publier n'importe lequel de tes packs, même s'il a été créé ailleurs</i>
      owner_proof: |
        <b>Pour confirmer que ce pack t'appartient, suis ces quelques étapes simples :</b>
        1. Ouvre le bot @Stickers
        2. Envoie la commande <code>/packstats</code>
        3. Trouve et choisis le pack concerné
        4. Transfère-moi le message reçu
      publish_new_access_denied: |
        Ce n'est pas ton pack.

        Tu ne peux publier que tes propres packs
      banned: |
        Tu n'as pas le droit d'utiliser cette fonctionnalité.
        Contacte l'administrateur.
      enter: |
        Publier <a href="${link}">${title}</a> dans le catalogue ?

        Les autres utilisateurs pourront trouver ton pack par son titre ou ses tags.

        <b>Règles :</b>
        • Uniquement des packs de qualité, destinés à un large public
        • Pas de photos personnelles ni de contenu privé
        • Rien d'illégal
      continue_button: Continuer
      enter_description: |
        <b>Décris brièvement ton pack pour que les autres puissent le trouver</b>

        <i>Tu peux utiliser des hashtags pour le classer [#]</i>
        <i>Par exemple : #anime #meme #animals #cute #kpop #funny #cat #game</i>
      select_language: |
        <b>Choisis les langues auxquelles ton pack est destiné :</b>
        <i>Tu peux en choisir plusieurs</i>
      button_all_languages: Toutes les langues
      button_confirm_language: Confirmer
      set_safe: |
        <b>Ton pack est-il tout public ?</b>
        <i>C'est-à-dire sans contenu érotique ni autre contenu choquant</i>
      button_safe:
        safe: Oui, tout public
        not_safe: Non, sensible
      no_tags: non renseignés
      confirm: |
        <b>Confirmer la publication du pack « <a href="${link}">${title}</a> »</b>

        <b>Description :</b> <i>${description}</i>

        <b>Tags :</b> ${tags}
        <b>Langues :</b> ${languages}
      button_confirm: '✅ Confirmer la publication'
      success: |
        Félicitations ! Ton pack est publié dans le catalogue, les autres utilisateurs peuvent maintenant le trouver !

        Tu peux modifier les informations du pack via /packs.

        <i>Les statistiques de ton pack sont consultables via le bot officiel @Stickers</i>
    unpublish:
      success: |
        Pack retiré du catalogue avec succès.
  delete_pack:
    enter: |
      ⚠️ Supprimer <a href="${link}">${title}</a> définitivement ?

      Envoie <code>${confirm}</code> pour confirmer.
    confirm: Oui, supprimer
    success: |
      🗑 Pack supprimé
    error:
      - Une erreur s'est produite.
  frame:
    no_sticker_set: |
      Tu n'as pas encore choisi de pack. Choisis-en un avec /packs, puis relance la commande.
    no_video: |
      Le cadre ne peut être ajouté qu'aux packs de stickers vidéo.
    select_type: |
      <a href="${example}">&#8203;</a><b>Choisis la forme du sticker :</b>

      <code>légère</code> — presque sans arrondi
      <code>moyenne</code> — coins légèrement arrondis
      <code>arrondie</code> — coins très arrondis
      <code>carrée</code> — coins droits, sans arrondi
      <code>ronde</code> — sticker en forme de cercle

      <i>Tu peux changer la forme avec la commande /frame</i>
    types:
      lite: '1. Légère'
      medium: '2. Moyenne'
      rounded: '3. Arrondie'
      square: '4. Carrée'
      circle: '5. Ronde'
    selected: |
      <b>Type de cadre choisi :</b> ${type}
  photoClear:
    enter: |
      <b>✂️ Suppression du fond</b>

      Envoie une photo — tu recevras un PNG sans fond.
      <i>Fonctionne mieux avec des photos de personnes.</i>
    enter_anime: |
      <b>✂️ Suppression du fond</b>

      Envoie une photo — tu recevras un PNG sans fond.
      <i>Fonctionne mieux avec des images d'anime.</i>
    choose_model: |
      Modèle :
    web_app: WebApp — pour les photos de personnes
    model:
      ordinary: Standard — pour les photos de personnes
      general: Général — pour toutes les photos
      anime: Anime — pour les images d'anime
      birefnet_general: BirefNet — pour toutes les photos
    add_to_set_btn: '🌟 Ajouter au pack'
    error: |
      Oups, une erreur s'est produite. Réessaie.
    error_timeout: |
      ⏱ Le traitement a pris trop de temps. Réessaie plus tard ou avec une photo plus petite.
    error_queue_disabled: |
      Cette fonctionnalité est temporairement indisponible. Réessaie plus tard.
  videoRound:
    enter: |
      <b>⭕ Vidéo ronde</b>

      Envoie une vidéo — je la transforme en message vidéo rond.
    not_video: |
      Envoie une vidéo, un GIF, un sticker vidéo ou une image animée.
    error: |
      Impossible de convertir. Essaie avec une autre vidéo.
    forbidden: |
      Je ne peux pas t'envoyer de message vidéo. Vérifie tes paramètres de confidentialité (les messages vocaux doivent être autorisés).
    processing: |
      ⏳ Conversion : ${position}/${total}

      <i>Boost = priorité → /donate</i>
    file_too_big: |
      Fichier trop volumineux (20 Mo max). Envoie une vidéo plus légère.
  search:
    error:
      not_found: |
        Aucun résultat. Essaie d'autres mots-clés.
    enter: |
      <b>🔍 Recherche de stickers</b>

      Saisis des mots-clés — je trouve les packs dans le catalogue.
  error:
    notFound: Pack introuvable
  leave: |
    Annulé
  btn:
    cancel: '← Annuler'
