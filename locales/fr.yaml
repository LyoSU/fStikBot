language_name: '🇫🇷 Français'
name: fStik — Stickers et émojis
description:
  long: |
    Crée des stickers et des émojis à partir de photos, vidéos et GIF. Aucune conversion manuelle : le bot s'occupe de tout. Plus simple que @Stickers.

    Fonctionnalités :
    • Gestion des packs
    • Stickers vidéo et émojis personnalisés
    • Téléchargement des originaux
    • Conversion d'un sticker, d'une vidéo ou d'un GIF en image
    • Catalogue de stickers

    Rechercher des stickers : play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Crée des stickers et des émojis à partir de photos, vidéos, GIF. Catalogue et recherche de stickers. 🇺🇦
ratelimit: Trop souvent !
