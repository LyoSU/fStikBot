  guide:
    web: |
      <b>📖 Comment utiliser fStikBot</b>

      Guides complets, astuces et FAQ sur notre site.
    menu: |
      <b>❓ Aide</b>

      Choisis un sujet :
    create: |
      <b>🎨 Créer des stickers</b>

      1. Envoie /new pour créer un pack
      2. Choisis le type : stickers, vidéo ou émojis
      3. Envoie des photos, vidéos ou GIF
      4. C'est prêt ! Le bot convertit tout lui-même

      <b>Commandes utiles :</b>
      • /clear — supprimer le fond d'une photo
      • /round — transformer une vidéo en vidéo ronde
      • /frame — forme du sticker vidéo :
        └ lite, medium, rounded, square, circle

      <b>💡 Astuce :</b> envoie les PNG en tant que <b>Fichier</b> (📎) pour garder la transparence. Le mode « Photo » les compresse et la supprime.
    manage: |
      <b>📁 Gérer les packs</b>

      <b>Commandes :</b>
      • /packs — liste de tes packs
      • /delete — supprimer un sticker
      • /copy — copier un pack
      • /restore — récupérer les packs masqués
      • /original — trouver l'original d'un sticker
      • /about — infos sur le pack et son auteur

      <b>Changer l'émoji :</b>
      Envoie le sticker → envoie le nouvel émoji.
      Ou envoie l'émoji juste après l'ajout.

      <b>Émoji par défaut :</b>
      /emoji 🔥 — tous les nouveaux stickers l'auront.

      <b>Dans les groupes :</b>
      /ss (en réponse à un média) — ajout rapide au pack du groupe.

      <b>Packs inline :</b>
      Un type de pack à part, accessible rapidement via @nom_du_bot dans n'importe quel chat.
      • Ce n'est pas un vrai pack Telegram — il est stocké uniquement dans le bot
      • Peut contenir des stickers, photos, GIF et vidéos
      • À créer dans /packs → onglet « Inline »
      • Propose aussi un mode de recherche de GIF (via Tenor)

      <b>Co-édition :</b>
      Appuie sur un pack → Co-édition → récupère le lien.
      Toute personne ayant le lien peut ajouter ou supprimer des stickers.
      Réinitialise le lien pour retirer tous les éditeurs.

      <b>Options du pack :</b>
      Appuie sur un pack dans /packs → renommer, booster, co-édition, supprimer.
    catalog: |
      <b>🔍 Catalogue</b>

      • /catalog — packs populaires
      • /publish — publier ton pack
      • Note les packs pour mettre en avant les meilleurs
    boost: |
      <b>⚡ Boost</b>

      • Sans « ${titleSuffix} » dans le titre
      • Traitement prioritaire des vidéos
      • Vidéos jusqu'à 30 s
      • Plusieurs stickers dans la file d'attente

      <b>Émojis adaptatifs</b> — bouton à part dans /new (ils prennent la couleur du texte)

      Obtenir → /donate
    problems: |
      <b>❓ FAQ</b>

      <b>⚫ Le fond est devenu noir ?</b>
      Telegram supprime la transparence si tu envoies l'image en tant que « Photo ».
      → Envoie les PNG en tant que <b>Fichier</b> (📎 trombone).

      <b>🔄 Les changements ne s'affichent pas ?</b>
      Telegram met les stickers en cache. Attends environ 1 heure ou redémarre l'application.

      <b>📹 La vidéo ne s'anime pas ?</b>
      Le format est sûrement inhabituel. Essaie de la convertir en MP4 ou envoie-la en tant que Fichier plutôt que Vidéo.

      <b>🗑 Comment supprimer un sticker ?</b>
      Envoie /delete, puis appuie sur le sticker.

      <b>🤏 Le sticker est trop petit ?</b>
      Recadre l'image en carré (1:1) avant de l'envoyer.

      <b>🔗 Comment retirer « _by_fStikBot » du lien ?</b>
      Impossible. Telegram exige ce suffixe pour savoir quel bot a créé le pack. C'est une règle de la plateforme, pas la nôtre.

      <b>💎 Faut-il Premium ?</b>
      • Créer des packs : gratuit
      • Utiliser les stickers : gratuit
      • Envoyer des émojis personnalisés : Premium uniquement (règle de Telegram)

      <b>D'autres questions ?</b> @fStikCommunity
