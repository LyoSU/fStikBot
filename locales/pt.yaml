---
language_name: '🇧🇷 Português'
name: fStik — Figurinhas e Emojis
description:
  long: |
    Crie figurinhas e emojis a partir de fotos, vídeos e GIFs. Sem conversão manual — o bot faz tudo sozinho. Mais fácil que o @Stickers.

    Recursos:
    • Gerenciamento de pacotes
    • Figurinhas de vídeo e emojis personalizados
    • Download dos arquivos originais
    • Conversão de figurinha/vídeo/GIF em imagem
    • Catálogo de figurinhas

    Busca de figurinhas: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Crie figurinhas e emojis a partir de fotos, vídeos e GIFs. Catálogo e busca de figurinhas. 🇺🇦
ratelimit: Muito rápido!
