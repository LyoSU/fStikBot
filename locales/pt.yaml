  guide:
    web: |
      <b>📖 Como usar o fStikBot</b>

      Guias completos, dicas e perguntas frequentes no nosso site.
    menu: |
      <b>❓ Ajuda</b>

      Escolha um tema:
    create: |
      <b>🎨 Criar figurinhas</b>

      1. Envie /new para criar um pacote
      2. Escolha o tipo: normal, vídeo ou emoji
      3. Envie fotos, vídeos ou GIFs
      4. Pronto! O bot converte tudo sozinho

      <b>Comandos úteis:</b>
      • /clear — remover o fundo da foto
      • /round — transformar vídeo em vídeo redondo
      • /frame — formato da figurinha de vídeo:
        └ lite, medium, rounded, square, circle

      <b>💡 Dica:</b> Envie PNG como <b>Arquivo</b> (📎) para manter a transparência. O modo "Foto" comprime a imagem e remove a transparência.
    manage: |
      <b>📁 Gerenciar pacotes</b>

      <b>Comandos:</b>
      • /packs — lista dos seus pacotes
      • /delete — excluir uma figurinha
      • /copy — copiar um pacote
      • /restore — restaurar pacotes ocultos
      • /original — encontrar a figurinha original
      • /about — informações do pacote e do autor

      <b>Alterar emoji:</b>
      Envie a figurinha → envie o novo emoji.
      Ou envie o emoji logo depois de adicionar.

      <b>Emoji padrão:</b>
      /emoji 🔥 — todas as novas figurinhas terão esse emoji.

      <b>Em grupos:</b>
      /ss (em resposta a uma mídia) — adiciona rapidamente ao pacote do grupo.

      <b>Pacotes inline:</b>
      Um tipo separado de pacote para acesso rápido via @nome_do_bot em qualquer chat.
      • Não é um pacote de verdade do Telegram — fica salvo só no bot
      • Pode conter figurinhas, fotos, GIFs e vídeos
      • Crie em /packs → aba "Inline"
      • Também tem um modo de busca de GIFs (via Tenor)

      <b>Edição compartilhada (Co-edit):</b>
      Toque no pacote → Co-edit → receba um link.
      Qualquer pessoa com o link pode adicionar/excluir figurinhas.
      Redefina o link para remover todos os editores.

      <b>Opções do pacote:</b>
      Toque em um pacote em /packs → renomear, boost, edição compartilhada, excluir.
    catalog: |
      <b>🔍 Catálogo</b>

      • /catalog — pacotes populares
      • /publish — publicar seu pacote
      • Avalie pacotes para dar destaque aos melhores
    boost: |
      <b>⚡ Boost</b>

      • Sem "${titleSuffix}" no nome
      • Processamento prioritário de vídeos
      • Vídeos de até 30 s
      • Várias figurinhas na fila

      <b>Emojis adaptáveis</b> — botão separado em /new (mudam de cor conforme o texto)

      Obter → /donate
    problems: |
      <b>❓ Perguntas frequentes</b>

      <b>⚫ O fundo ficou preto?</b>
      O Telegram remove a transparência quando você envia como "Foto".
      → Envie PNG como <b>Arquivo</b> (📎 clipe).

      <b>🔄 As alterações não aparecem?</b>
      O Telegram guarda as figurinhas em cache. Aguarde cerca de 1 hora ou reinicie o app.

      <b>📹 O vídeo não fica animado?</b>
      Provavelmente o formato é incomum. Tente converter para MP4 ou enviar como Arquivo em vez de Vídeo.

      <b>🗑 Como excluir uma figurinha?</b>
      Envie /delete e toque na figurinha.

      <b>🤏 A figurinha ficou pequena demais?</b>
      Corte a imagem em formato quadrado (1:1) antes de enviar.

      <b>🔗 Como tirar o "_by_fStikBot" do link?</b>
      Não tem como. O Telegram exige esse sufixo para identificar qual bot criou o pacote. É uma regra da plataforma, não nossa.

      <b>💎 Preciso do Premium?</b>
      • Criar pacotes: grátis
      • Usar figurinhas: grátis
      • Enviar emojis personalizados: só com Premium (regra do Telegram)

      <b>Mais dúvidas?</b> @fStikCommunity
