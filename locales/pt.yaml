      Para adicionar um sticker ao pacote do grupo, use /ss em resposta a uma foto, vídeo, GIF ou sticker.
    catalog: |
      <b>🔍 Catálogo de stickers</b>

      Busque pacotes por palavras-chave ou veja os populares.
      Avalie pacotes para ajudar outras pessoas a encontrar os melhores.
    search_catalog: |
