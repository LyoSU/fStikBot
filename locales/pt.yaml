userAbout:
  help: |
    <b>🧑‍🎨 Sobre o usuário</b>

    Neste menu você pode ver informações sobre um usuário e os pacotes de stickers dele

    Para ver as informações de um usuário, use o botão abaixo ou encaminhe uma mensagem dele
  result: |
    <b>🧑‍🎨 Informações do usuário</b>
    <b>🆔 ID do usuário:</b> <code>${userId}</code>
    <b>🎨 Pacotes deste usuário:</b>
    ${packs}
  no_packs: |
    <i>Não temos informações sobre os pacotes deste autor</i>
  forward_hidden: |
    Este usuário restringiu o encaminhamento de mensagens. Use o botão abaixo para ver seus pacotes de stickers.
  select_user: '🧑‍🎨 Escolher usuário'
scenes:
  new_pack:
    pack_type: |
      <b>Que tipo de pacote vamos criar?</b>

      <b>🖼 Stickers</b> — os clássicos, enviados no chat.
      <b>✨ Emojis</b> — emojis personalizados dentro do texto. Só usuários do Telegram Premium podem enviá-los.
      <b>🎨 Emojis adaptáveis</b> — monocromáticos: desenhados em uma só cor, eles se ajustam automaticamente à cor do texto.
    regular: '🖼 Stickers'
    custom_emoji: '✨ Emojis'
    custom_emoji_adaptive: '🎨 Emojis adaptáveis'
    pack_title: |
      <b>Título do pacote</b>

      Todos vão ver. Digite o seu ou escolha uma das sugestões abaixo.
      <i>Vou criar o link do pacote a partir do título.</i>
    pack_name: |
      <b>Link do pacote</b>

      Apenas letras latinas, números e <code>_</code>. Exemplo: t.me/addstickers/<u>MeusStickers</u>
    ok: |
      ✅ Pacote criado: <a href="${link}">${title}</a>

      Envie uma foto, vídeo ou sticker para adicionar.
    error:
      title_long: O título não pode ter mais de ${max} caracteres.
      name_long: O link não pode ter mais de ${max} caracteres.
      inline_exists: |
        Você já tem um pacote inline — <b>${title}</b>.

        Só é possível ter um pacote inline: criar outro apagaria este.
        Ele já está selecionado, então é só continuar adicionando stickers.
      telegram:
        name_invalid: Não é possível usar este link.
        name_occupied: Este link já está em uso. Escolha outro.
        upload_failed: |
          O bot não consegue enviar os stickers para o Telegram.

          Tente novamente mais tarde.
    btn:
      custom_link: '🔗 Meu próprio link'
    custom_link_on: 'Beleza — envie o título e depois eu peço o link.'
  copy:
    enter: |
      Primeiro, vamos criar um novo pacote para a cópia.
    progress: |
      ⏳ Copiando: ${current}/${total}
    done: |
      ✅ Copiado para <a href="${link}">${title}</a>
    done_partial: |
      ⚠️ Copiado para <a href="${link}">${title}</a>

      ${success} stickers copiados, ${failed} falharam.
    done_pending: |
      ✅ Copiado para <a href="${link}">${title}</a>

      ${success} stickers copiados, ${pending} vídeos ainda em processamento.
    done_partial_pending: |
      ⚠️ Copiado para <a href="${link}">${title}</a>

      ${success} stickers copiados, ${failed} falharam, ${pending} vídeos ainda em processamento.
    pay: |
      <b>Conversão de pacote</b>

      Converter um pacote de um tipo para outro custa 1 crédito

      <b>Saldo atual:</b> ${balance} créditos

      Comprar créditos: /donate
    pay_btn: '✅ Confirmar'
    error:
      all_failed: |
        ❌ Não foi possível copiar nenhum sticker de <a href="${originalLink}">${originalTitle}</a>.

        O pacote não foi criado.
      premium: |
        Este recurso está disponível apenas para quem apoiou o bot.

        Você pode apoiar enviando /donate.
    title: |
      <b>📋 Copiando <a href="${originalLink}">${originalTitle}</a></b> (${count})

      Título da sua cópia — digite o seu ou escolha um abaixo.
    btn:
      change_type: '🔄 Mudar tipo'
    created: |
      ✅ Pacote criado: <a href="${link}">${title}</a>

      Copiando os stickers — aviso quando terminar.
  original:
    enter: |
      <b>🔎 Encontrar original</b>

      Envie um sticker — mostro de qual pacote ele foi copiado.
      Se o original não for encontrado, você recebe o arquivo (PNG/WEBM).
    source_found: |
      🔎 Copiado de: <a href="${link}">${title}</a>
    error:
      not_found: |
        Original não encontrado. Aqui está o arquivo do sticker:
  delete:
    enter: |
      <b>🗑 Apagar sticker</b>

      Envie um sticker — apago do pacote na hora (dá para restaurar). Envie quantos quiser.
    confirm: |
      Apagar este sticker do pacote?
    error:
      not_found: |
        Sticker não encontrado no banco de dados. Talvez ele não tenha sido criado por este bot.
  rename:
    enter_name: |
      Novo título para <a href="${link}">${title}</a>:
    success: |
      ✅ Renomeado: <a href="${link}">${title}</a>
    boost_notice: |
      O Boost remove "${titleSuffix}" → /donate
  packAbout:
    enter: |
      <b>🔎 De quem é o sticker</b>

      Envie um sticker — mostro o pacote, o autor e os outros pacotes dele.
      Ou encaminhe uma mensagem — mostro os pacotes dessa pessoa.
    not_found: |
      Sticker não encontrado.
    btn:
      download: '📎 Baixar arquivo'
      show_all_packs: '📦 Todos os pacotes (${count})'
    result: |
      <b>📦 Pacote:</b> <a href="${link}">${name}</a>
      🔢 Stickers: <code>${stickerCount}</code> | 🏷 #<code>${setId}</code> | ${dcId}

      🧑‍🎨 ID do autor: <code>${ownerId}</code>
      ${mention}

      <b>🎨 Outros pacotes deste autor:</b>
      ${otherPacks}
    no_other_packs: |
      <i>Não temos informações sobre outros pacotes deste autor</i>
    unknown_owner: '<i>Desconhecido</i>'
    hidden: '<i>[oculto]</i>'
  boost:
    sure: |
      Ativar Boost em <a href="${link}">${title}</a>?

      <b>Preço:</b> 1 crédito
      <b>Saldo:</b> ${balance}
    btn:
      buy: '⭐ Comprar créditos'
      yes: '⚡ Boost'
      no: Cancelar
    canceled: |
      Cancelado
    success: |
      ⚡ <a href="${link}">${title}</a> — Boost ativado!

      <b>Desbloqueado:</b>
      • Título sem o sufixo "${titleSuffix}" — após renomear
      • Até 64 caracteres no título (em vez de 35)
      • Vídeos de até 35 segundos
      • Prioridade na fila de conversão
      • Vários stickers ao mesmo tempo

      <i>Para remover o sufixo, toque em "✏️ Renomear" no menu do pacote.</i>
    error:
      too_fast: Mais devagar — tente de novo em um segundo.
      not_enough_credits: |
        Créditos insuficientes. /donate
      already_boosted: |
        O Boost já está ativo.
  catalog:
    publish:
      publish_new: |
        👌 <b>Envie um sticker do pacote que você quer publicar</b>

        <i>Você pode publicar qualquer pacote seu, mesmo que tenha sido criado em outro lugar</i>
      owner_proof: |
        <b>Para confirmar que o pacote é seu, siga estes passos simples:</b>
        1. Abra o bot @Stickers
        2. Envie o comando <code>/packstats</code>
        3. Encontre e escolha o pacote
        4. Encaminhe a mensagem recebida para mim
      publish_new_access_denied: |
        Este pacote não é seu.

        Você só pode publicar seus próprios pacotes.
      banned: |
        Você está proibido de usar este recurso.
        Fale com o administrador.
      enter: |
        Publicar <a href="${link}">${title}</a> no catálogo?

        Outras pessoas poderão encontrar seu pacote pelo título ou pelas tags.

        <b>Regras:</b>
        • Só pacotes de qualidade, para um público amplo
        • Sem fotos pessoais ou conteúdo privado
        • Nada que viole as leis
      continue_button: Continuar
      enter_description: |
        <b>Descreva seu pacote em poucas palavras para que outros possam encontrá-lo</b>

        <i>Você pode usar hashtags para categorizar [#]</i>
        <i>Por exemplo: #anime #meme #animals #cute #kpop #funny #cat #game</i>
      current_description: |

        <b>Descrição atual:</b> <i>${description}</i>
      keep_description: '✅ Manter descrição'
      select_language: |
        <b>Escolha para quais idiomas seu pacote é indicado:</b>
        <i>Você pode escolher mais de um</i>
      button_all_languages: Qualquer idioma
      button_confirm_language: Confirmar
      set_safe: |
        <b>Seu pacote é seguro para todos os públicos?</b>
        <i>Ou seja: sem erotismo, violência ou outro conteúdo +18</i>
      button_safe:
        safe: '✅ Sim, sem +18'
        not_safe: '🔞 Não, contém +18'
      no_tags: não informadas
      confirm: |
        <b>Confirmar publicação do pacote de stickers "<a href="${link}">${title}</a>"</b>

        <b>Descrição:</b> <i>${description}</i>

        <b>Tags:</b> ${tags}
        <b>Idiomas:</b> ${languages}
      button_confirm: '✅ Publicar pacote'
      success: |
        Parabéns! Seu pacote foi publicado no catálogo e agora outras pessoas podem encontrá-lo!

        Você pode editar as informações do pacote em /packs.

        <i>Você pode ver as estatísticas do seu pacote pelo bot oficial @Stickers</i>
    unpublish:
      success: |
        O pacote foi removido do catálogo.
  delete_pack:
    enter: |
      ⚠️ Apagar <a href="${link}">${title}</a> para sempre?

      Toque em «${confirm}» para confirmar ou em «Cancelar».
    confirm: Sim, apagar
    success: |
      🗑 Pacote apagado
    error:
      - Algo deu errado.
  frame:
    no_sticker_set: |
      Você ainda não escolheu um pacote. Escolha um em /packs e repita o comando.
    no_video: |
      Só é possível alterar o formato em pacotes de vídeo.
    select_type: |
      <a href="${example}">&#8203;</a><b>Escolha o formato do sticker:</b>

      <code>leve</code> — quase sem arredondamento
      <code>média</code> — cantos levemente arredondados
      <code>arredondada</code> — cantos bem arredondados
      <code>quadrada</code> — cantos retos, sem arredondamento
      <code>circular</code> — sticker em formato de círculo

      <i>Você pode mudar o formato com o comando /frame</i>
    types:
      lite: '1. Leve'
      medium: '2. Média'
      rounded: '3. Arredondada'
      square: '4. Quadrada'
      circle: '5. Circular'
    selected: |
      <b>Formato escolhido:</b> ${type}
  photoClear:
    enter: |
      <b>✂️ Remover fundo</b>

      Envie uma foto — você recebe um PNG sem fundo.
      <i>Modelo para suas fotos:</i>
    enter_anime: |
      <b>✂️ Remover fundo</b>

      Envie uma foto — você recebe um PNG sem fundo.
      <i>Funciona melhor com anime.</i>
    choose_model: |
      Modelo:
    web_app: WebApp — para fotos de pessoas
    model:
      ordinary: Padrão — para fotos de pessoas
      general: Geral — para qualquer foto
      anime: Anime — para imagens de anime
      birefnet_general: BiRefNet — para qualquer foto
    add_to_set_btn: '🌟 Salvar no pacote'
    error: |
      Ops, algo deu errado. Tente de novo.
    error_timeout: |
      ⏱ O processamento demorou muito. Tente mais tarde ou com uma foto menor.
    error_queue_disabled: |
      Este recurso está temporariamente indisponível. Tente mais tarde.
    not_image: 'Envie uma foto ou uma imagem como arquivo (PNG, JPEG, WebP).'
  videoRound:
    enter: |
      <b>⭕ Vídeo redondo</b>

      Envie um vídeo — vou transformá-lo em mensagem de vídeo redonda.
    not_video: |
      Envie um vídeo, GIF, sticker de vídeo ou imagem animada.
    error: |
      Não foi possível converter. Tente outro vídeo.
    forbidden: |
      Não consigo enviar a mensagem de vídeo para você. Verifique suas configurações de privacidade (mensagens de voz precisam estar permitidas).
    processing: |
      ⏳ Convertendo: ${position}/${total}

      <i>Boost = prioridade → /donate</i>
    file_too_big: |
      O arquivo é grande demais (máx. 20 MB). Envie um vídeo menor.
  search:
    error:
      not_found: |
        Nada encontrado. Tente outras palavras-chave.
    enter: |
      <b>🔍 Buscar stickers</b>

      Digite palavras-chave — vou encontrar pacotes no catálogo.
  error:
    notFound: Pacote não encontrado
  leave: |
    Cancelado
  btn:
    cancel: '← Cancelar'
  unexpected: 'Estou aguardando outra ação agora — siga o passo acima ou toque em «← Cancelar».'
error:
  stickerset_invalid: |
    O pacote está indisponível. Talvez ele tenha sido apagado no Telegram.
  telegram_reasons:
    sticker_not_in_set: |
      O sticker não está mais no pacote — talvez já tenha sido apagado.
    pack_invalid: |
      O pacote de stickers está indisponível. Talvez tenha sido apagado no Telegram.
    pack_full: |
      O pacote está cheio (limite do Telegram atingido). Apague alguns stickers e tente de novo.
    not_pack_owner: |
      Este pacote pertence a outro usuário — não é possível alterá-lo.
    pack_name_taken: |
      Este link já está em uso. Escolha outro nome.
    pack_name_invalid: |
      O link do pacote tem formato inválido. Use apenas letras latinas, números e sublinhado (_).
    invalid_sticker_format: |
      Este arquivo não pode ser usado como sticker: formato ou dimensões incorretos.
    invalid_emoji: |
      Emoji inválido. Envie um emoji Unicode padrão.
    rate_limited: |
      O Telegram pediu para aguardar — tente de novo em alguns segundos.
    cannot_reach_user: |
      Não consigo enviar mensagem ao usuário: o bot foi bloqueado ou o chat está indisponível.
  file_too_big: |
    O arquivo é grande demais (máx. 20 MB).
  download: |
    Não foi possível baixar o arquivo. Tente de novo.
  banned: |
    🚫 Acesso negado. Dúvidas → @ly_oBot
  access_denied: Acesso negado
  unknown: |
    Algo deu errado. Tente de novo.

    Não resolveu? Fale com @Ly_oBot
  rate_limit: |
    ⏳ Muitas solicitações. Aguarde um instante e tente de novo.
  rate_limit_seconds: |
    ⏳ Muitas solicitações. Aguarde ${seconds} segundos.
