    hint: 'Envie uma foto, vídeo, GIF ou sticker — eu adiciono em <a href="${link}">${title}</a>.'
  guide:
    web: |
      <b>📖 Como funciona</b>

      1. /new — crie um pacote
      2. Envie fotos, vídeos, GIFs ou stickers — até um álbum inteiro
      3. /packs — seus pacotes e as configurações deles

      Guias, dicas e perguntas frequentes estão no site.
    menu: |
      <b>❓ Ajuda</b>

      Escolha um tema:
    create: |
      <b>🎨 Criar stickers</b>

      1. Envie /new para criar um pacote
      2. Escolha o tipo: normal, vídeo ou emoji
      3. Envie fotos, vídeos ou GIFs
      4. Pronto! O bot converte tudo sozinho

      <b>Comandos úteis:</b>
      • /clear — remover o fundo da foto
      • /round — transformar vídeo em mensagem de vídeo (círculo)
      • /frame — formato do sticker de vídeo:
        └ lite, medium, rounded, square, circle

      <b>💡 Dica:</b> Envie PNG como <b>Arquivo</b> (📎) para manter a transparência. O modo "Foto" comprime a imagem e remove a transparência.
    manage: |
      <b>📁 Gerenciar pacotes</b>

      <b>Comandos:</b>
      • /packs — lista dos seus pacotes
      • /delete — apagar um sticker
      • /copy — copiar um pacote
      • /restore — restaurar pacotes ocultos
      • /original — encontrar o original do sticker
      • /about — informações do pacote e do autor

      <b>Alterar emoji:</b>
      Envie o sticker → envie o novo emoji.
      Ou envie o emoji logo depois de adicionar.

      <b>Emoji padrão:</b>
      /emoji 🔥 — todos os novos stickers terão esse emoji.

      <b>Em grupos:</b>
      /ss (em resposta a uma mídia) — adiciona rapidamente ao pacote do grupo.

      <b>Pacotes inline:</b>
      Sua coleção pessoal: envie stickers, GIFs, fotos e vídeos salvos em qualquer chat — digite @botname e escolha o que precisar.
      • Nada é adicionado aos seus stickers do Telegram — tudo fica salvo no bot
      • Pode conter stickers, fotos, GIFs e vídeos
      • Crie em /packs → aba "Inline"
      • Também tem um modo de busca de GIFs (via Tenor)

      <b>Colaboração:</b>
      Toque no pacote → Colaboração → receba um link.
      Qualquer pessoa com o link pode adicionar ou apagar stickers.
      Redefina o link para remover o acesso de todos.

      <b>Opções do pacote:</b>
      Toque em um pacote em /packs → renomear, Boost, colaboração, apagar.
    catalog: |
      <b>🔍 Catálogo</b>

      • /catalog — pacotes populares
      • /publish — publicar seu pacote
      • Avalie pacotes para dar destaque aos melhores
    boost: |
      <b>⚡ Boost</b>

      • Sem "${titleSuffix}" no título
      • Processamento prioritário de vídeos
      • Vídeos de até 35 segundos
      • Vários stickers ao mesmo tempo

      <b>🎨 Emojis adaptáveis</b> — um tipo de pacote separado em /new: os emojis mudam de cor conforme o texto

      Obter → /donate
    problems: |
      <b>❓ Perguntas frequentes</b>

      <b>⚫ O fundo ficou preto?</b>
      O Telegram remove a transparência quando você envia como "Foto".
      → Envie PNG como <b>Arquivo</b> (📎 clipe).

      <b>🔄 As alterações não aparecem?</b>
      O Telegram guarda os stickers em cache. Aguarde cerca de 1 hora ou reinicie o app.

      <b>📹 O vídeo não se mexe?</b>
      Provavelmente o formato é incomum. Tente converter para MP4 ou enviar como Arquivo em vez de Vídeo.

      <b>🗑 Como apagar um sticker?</b>
      Envie /delete e toque no sticker.

      <b>🤏 O sticker ficou pequeno demais?</b>
      Corte a imagem em formato quadrado (1:1) antes de enviar.

      <b>🔗 Como tirar o "_by_fStikBot" do link?</b>
      Não tem como. O Telegram exige esse sufixo para identificar qual bot criou o pacote. É uma regra da plataforma, não nossa.

      <b>💎 Preciso do Premium?</b>
      • Criar pacotes: grátis
      • Usar stickers: grátis
      • Enviar emojis personalizados: só com Premium (regra do Telegram)

      <b>Mais dúvidas?</b> @fStikCommunity
