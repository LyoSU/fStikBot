---
language_name: '🇧🇷 Português'
name: fStik — Stickers e Emojis
description:
  long: |
    Crie stickers e emojis a partir de fotos, vídeos e GIFs. Sem conversão manual — o bot faz tudo sozinho. Mais fácil que o @Stickers.

    Recursos:
    • Gerenciamento de pacotes
    • Stickers de vídeo e emojis personalizados
    • Download dos arquivos originais
    • Conversão de sticker/vídeo/GIF em imagem
    • Catálogo de stickers

    Busca de stickers: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Crie stickers e emojis a partir de fotos, vídeos e GIFs. Catálogo e busca de stickers. 🇺🇦
ratelimit: Rápido demais!
