      add_to_group: '👥 Дадаць у суполку'
      privacy: '🔒 Прыватнасць'
      guide: '❓ Дапамога'
    btn:
      new: '➕ Новы набор'
      catalog: '🔍 Каталог'
      catalog_mini: '🔍 Каталог'
      catalog_browser: 'Адкрыць у браўзеры'
      catalog_browser_mini: '🌐 У браўзеры'
      catalog_app: '📱 Спампаваць для Android'
      catalog_app_mini: '📱 Праграма для Android'
    current_pack: '📦 Стыкеры дадаюцца ў: <a href="${link}">${title}</a>'
    hint: 'Дашлі фота, відэа, анімацыю або стыкер — дадам у <a href="${link}">${title}</a>.'
  guide:
    web: |
      <b>📖 Як гэта працуе</b>

      1. /new — ствары набор
      2. Дасылай фота, відэа, анімацыі або стыкеры — нават цэлым альбомам
      3. /packs — твае наборы і іх налады

      Гайды, парады і FAQ — на сайце.
    menu: |
      <b>❓ Дапамога</b>

      Абяры тэму:
    create: |
      <b>🎨 Стварэнне стыкераў</b>

      1. Дашлі /new, каб стварыць набор
      2. Абяры тып: звычайны, відэа або эмодзі
      3. Дасылай фота, відэа ці анімацыі
      4. Гатова! Бот сам усё канвертуе

      <b>Карысныя каманды:</b>
      • /clear — выдаліць фон з фота
      • /round — зрабіць відэапаведамленне з відэа
      • /frame — форма відэастыкера:
        └ lite, medium, rounded, square, circle

      <b>💡 Парада:</b> Дасылай PNG як <b>Файл</b> (📎), каб захаваць празрыстасць. Рэжым «Фота» сціскае выяву і прыбірае празрыстасць.
    manage: |
      <b>📁 Кіраванне наборамі</b>

      <b>Каманды:</b>
      • /packs — спіс тваіх набораў
      • /delete — выдаліць стыкер
      • /copy — скапіяваць набор
      • /restore — вярнуць схаваныя наборы
      • /original — знайсці арыгінал стыкера
      • /about — звесткі пра набор і аўтара

      <b>Змяніць эмодзі:</b>
      Дашлі стыкер → дашлі новае эмодзі.
      Або дашлі эмодзі адразу пасля дадавання.

      <b>Стандартнае эмодзі:</b>
      /emoji 🔥 — усе новыя стыкеры атрымаюць яго.

      <b>У суполках:</b>
      /ss (у адказ на медыя) — хуткае дадаванне ў набор суполкі.

      <b>Інлайн-наборы:</b>
      Твая асабістая калекцыя: дасылай захаваныя стыкеры, анімацыі, фота і відэа ў любым чаце — напішы @імя_бота і выберы патрэбнае.
      • У стыкеры Telegram нічога не дадаецца — усё захоўваецца ў боце
      • Можа змяшчаць стыкеры, фота, анімацыі, відэа
      • Ствары ў /packs → укладка «Інлайн»
      • Таксама ёсць рэжым пошуку анімацый (праз Tenor)

      <b>Супольнае рэдагаванне:</b>
      Націсні на набор → Супольнае рэдагаванне → атрымай спасылку.
      Кожны, у каго ёсць спасылка, можа дадаваць і выдаляць стыкеры.
      Скінь спасылку, каб прыбраць усіх рэдактараў.

      <b>Дзеянні з наборам:</b>
      Націсні на набор у /packs → змяніць назву, буст, супольнае рэдагаванне, выдаліць.
    catalog: |
      <b>🔍 Каталог</b>

      • /catalog — папулярныя наборы
      • /publish — апублікаваць свой набор
      • Ацэньвай наборы, каб прасоўваць класныя
    boost: |
      <b>⚡ Буст</b>

      • Без "${titleSuffix}" у назве
      • Прыярытэтная апрацоўка відэа
      • Відэа да 35 секунд
      • Некалькі стыкераў адначасова

      <b>🎨 Адаптыўныя эмодзі</b> — асобны тып набору ў /new: эмодзі змяняюць колер пад тэкст

      Атрымаць → /donate
    problems: |
      <b>❓ FAQ</b>

      <b>⚫ Фон стаў чорным?</b>
      Telegram прыбірае празрыстасць, калі даслаць як «Фота».
      → Дасылай PNG як <b>Файл</b> (📎 сашчэпка).

      <b>🔄 Не відаць змен?</b>
      Telegram кэшуе стыкеры. Пачакай ~1 гадзіну або перазапусці праграму.

      <b>📹 Відэа не анімуецца?</b>
      Хутчэй за ўсё, фармат незвычайны. Паспрабуй канвертаваць у MP4 або дашлі як Файл замест Відэа.

      <b>🗑 Як выдаліць стыкер?</b>
      Дашлі /delete, потым націсні на стыкер.

      <b>🤏 Стыкер замалы?</b>
      Абрэж выяву да квадрата (1:1) перад адпраўкай.

      <b>🔗 Як прыбраць "_by_fStikBot" са спасылкі?</b>
      Ніяк. Telegram патрабуе гэты суфікс, каб вызначыць, якім ботам створаны набор. Гэта правіла платформы, не наша.

      <b>💎 Ці патрэбны Premium?</b>
      • Ствараць наборы: бясплатна
      • Карыстацца стыкерамі: бясплатна
      • Дасылаць карыстальніцкія эмодзі: толькі з Premium (правіла Telegram)

      <b>Яшчэ пытанні?</b> @fStikCommunity
    btn:
      open: '📖 Адкрыць гайд'
      create: '🎨 Стварэнне стыкераў'
      manage: '📁 Кіраванне наборамі'
      catalog: '🔍 Пошук і каталог'
      boost: '⚡ Буст і магчымасці'
      problems: '❓ Частыя пытанні'
      back: '← Назад'
  inline:
