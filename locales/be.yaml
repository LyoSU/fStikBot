---
language_name: '🇧🇾 Беларуская'
name: fStik — Стыкеры і эмодзі
description:
  long: |
    Стварай стыкеры і эмодзі з фота, відэа і анімацый. Без ручной канвертацыі — бот зробіць усё сам. Прасцей, чым @Stickers.

    Магчымасці:
    • Кіраванне наборамі
    • Відэастыкеры і карыстальніцкія эмодзі
    • Спампоўванне арыгіналаў
    • Канвертацыя стыкера/відэа/анімацыі ў выяву
    • Каталог стыкераў

    Пошук стыкераў: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Стварай стыкеры і эмодзі з фота, відэа, анімацый. Каталог і пошук стыкераў. 🇺🇦
ratelimit: Занадта часта!
cmd:
  start:
    enter: |
      Прывітанне, ${name}!
      Ствараю стыкеры і эмодзі з фота, відэа і анімацый.

      💬 @fStikCommunity
    group: |
      Прывітанне, ${groupTitle}! Я ствараю стыкеры і эмодзі.

      Каб дадаць стыкер у набор суполкі, выкарыстай /ss у адказ на фота, відэа, анімацыю ці стыкер.
    catalog: |
      <b>🔍 Каталог стыкераў</b>

      Шукай наборы па ключавых словах або праглядай папулярныя.
      Ацэньвай, каб дапамагчы іншым знайсці класныя наборы.
    search_catalog: |
      <b>🌐 Каталог набораў</b>

      Праглядай наборы іншых або публікуй свае:
    commands:
      ss: '➕ Дадаць у набор суполкі'
      start: '📜 Меню'
      help: '❓ Дапамога'
      packs: '📁 Мае наборы'
      new: '➕ Новы набор'
      search_catalog: '🌐 Каталог'
      catalog: '🌐 Каталог'
      publish: '📤 Апублікаваць'
      delete: '🗑 Выдаліць стыкер'
      original: '🔎 Адкуль стыкер'
      restore: '♻️ Аднавіць набор'
      copy: '📋 Скапіяваць набор'
      emoji: '😀 Змяніць эмодзі'
      round: '⭕ Відэапаведамленне'
      clear: '✂️ Выдаліць фон'
      info: '🔎 Чый стыкер'
      user_about: '👤 Пра аўтара'
      lang: '🌐 Мова'
      report: '🚨 Скарга'
