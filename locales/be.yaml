  guide:
    web: |
      <b>📖 Як гэта працуе</b>

      1. /new — ствары пак
      2. Дасылай фота, відэа, GIF або стыкеры — нават цэлым альбомам
      3. /packs — твае пакі і іх налады

      Гайды, парады і FAQ — на сайце.
    menu: |
      <b>❓ Дапамога</b>

      Абяры тэму:
    create: |
      <b>🎨 Стварэнне стыкераў</b>

      1. Дашлі /new, каб стварыць пак
      2. Абяры тып: звычайны, відэа або эмодзі
      3. Дасылай фота, відэа ці GIF
      4. Гатова! Бот сам усё канвертуе

      <b>Карысныя каманды:</b>
      • /clear — выдаліць фон з фота
      • /round — зрабіць кружок з відэа
      • /frame — форма відэастыкера:
        └ lite, medium, rounded, square, circle

      <b>💡 Парада:</b> Дасылай PNG як <b>Файл</b> (📎), каб захаваць празрыстасць. Рэжым «Фота» сціскае выяву і прыбірае празрыстасць.
    manage: |
      <b>📁 Кіраванне пакамі</b>

      <b>Каманды:</b>
      • /packs — спіс тваіх пакаў
      • /delete — выдаліць стыкер
      • /copy — скапіяваць пак
      • /restore — вярнуць схаваныя пакі
      • /original — знайсці арыгінал стыкера
      • /about — звесткі пра пак і аўтара

      <b>Змяніць эмодзі:</b>
      Дашлі стыкер → дашлі новае эмодзі.
      Або дашлі эмодзі адразу пасля дадавання.

      <b>Эмодзі па змаўчанні:</b>
      /emoji 🔥 — усе новыя стыкеры атрымаюць яго.

      <b>У групах:</b>
      /ss (у адказ на медыя) — хуткае дадаванне ў групавы пак.

      <b>Інлайн-пакі:</b>
      Твая асабістая калекцыя: дасылай захаваныя стыкеры, GIF, фота і відэа ў любым чаце — напішы @імя_бота і выберы патрэбнае.
      • У стыкеры Telegram нічога не дадаецца — усё захоўваецца ў боце
      • Можа змяшчаць стыкеры, фота, GIF, відэа
      • Ствары ў /packs → укладка «Інлайн»
      • Таксама ёсць рэжым пошуку GIF (праз Tenor)

      <b>Сумеснае рэдагаванне (Co-edit):</b>
      Націсні на пак → Co-edit → атрымай спасылку.
      Кожны, у каго ёсць спасылка, можа дадаваць і выдаляць стыкеры.
      Скінь спасылку, каб прыбраць усіх рэдактараў.

      <b>Опцыі пака:</b>
      Націсні на пак у /packs → перайменаваць, буст, сумеснае рэдагаванне, выдаліць.
    catalog: |
      <b>🔍 Каталог</b>

      • /catalog — папулярныя пакі
      • /publish — апублікаваць свой пак
      • Ацэньвай пакі, каб прасоўваць класныя
    boost: |
      <b>⚡ Буст</b>

      • Без "${titleSuffix}" у назве
      • Прыярытэтная апрацоўка відэа
      • Відэа да 35 секунд
      • Некалькі стыкераў адначасова

      <b>🎨 Адаптыўныя эмодзі</b> — асобны тып пака ў /new: эмодзі змяняюць колер пад тэкст

      Атрымаць → /donate
    problems: |
      <b>❓ FAQ</b>

      <b>⚫ Фон стаў чорным?</b>
      Telegram прыбірае празрыстасць, калі даслаць як «Фота».
      → Дасылай PNG як <b>Файл</b> (📎 сашчэпка).

      <b>🔄 Змены не відаць?</b>
      Telegram кэшуе стыкеры. Пачакай ~1 гадзіну або перазапусці праграму.

      <b>📹 Відэа не анімуецца?</b>
      Хутчэй за ўсё, фармат нестандартны. Паспрабуй канвертаваць у MP4 або дашлі як Файл замест Відэа.

      <b>🗑 Як выдаліць стыкер?</b>
      Дашлі /delete, потым націсні на стыкер.

      <b>🤏 Стыкер замалы?</b>
      Абрэж выяву да квадрата (1:1) перад адпраўкай.

      <b>🔗 Як прыбраць "_by_fStikBot" са спасылкі?</b>
      Ніяк. Telegram патрабуе гэты суфікс, каб вызначыць, якім ботам створаны пак. Гэта правіла платформы, не наша.

      <b>💎 Ці патрэбны Premium?</b>
      • Ствараць пакі: бясплатна
      • Карыстацца стыкерамі: бясплатна
      • Дасылаць уласныя эмодзі: толькі з Premium (правіла Telegram)

      <b>Яшчэ пытанні?</b> @fStikCommunity
