---
language_name: '🇧🇾 Беларуская'
name: fStik — Стыкеры і эмодзі
description:
  long: |
    Стварай стыкеры і эмодзі з фота, відэа і GIF. Без ручной канвертацыі — бот зробіць усё сам. Прасцей, чым @Stickers.

    Магчымасці:
    • Кіраванне пакамі
    • Відэастыкеры і ўласныя эмодзі
    • Спампоўванне арыгіналаў
    • Канвертацыя стыкера/відэа/GIF у выяву
    • Каталог стыкераў

    Пошук стыкераў: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Стварай стыкеры і эмодзі з фота, відэа, GIF. Каталог і пошук стыкераў. 🇺🇦
ratelimit: Занадта часта!
cmd:
  start:
    enter: |
      Прывітанне, ${name}!
      Ствараю стыкеры і эмодзі з фота, відэа і GIF.

      💬 @fStikCommunity
