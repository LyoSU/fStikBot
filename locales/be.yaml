      Прывітанне, ${groupTitle}! Я ствараю стыкеры і эмодзі.

      Каб дадаць стыкер у групавы пак, выкарыстай /ss у адказ на фота, відэа, GIF ці стыкер.
    catalog: |
      <b>🔍 Каталог стыкераў</b>

      Шукай пакі па ключавых словах або праглядай папулярныя.
      Ацэньвай, каб дапамагчы іншым знайсці класныя пакі.
    search_catalog: |
      <b>🌐 Каталог пакаў</b>

      Праглядай пакі іншых або публікуй свае:
