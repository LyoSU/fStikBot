donate:
  menu: |
    <b>⭐ Падтрымка бота</b>

    <b>Баланс:</b> ${balance} крэдытаў
    1 крэдыт = буст аднаго набору

    <b>Буст дае:</b>
    • Без "<code>${titleSuffix}</code>" у назве
    • Назва да 64 сімвалаў (замест 35)
    • Відэа да 35 секунд
    • Прыярытэтная чарга канвертацыі
    • Некалькі стыкераў адначасова
    • Без рэкламы

    <b>Колькі крэдытаў купіць?</b>
