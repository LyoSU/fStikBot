name: fStik — Стикерлер мен эмоджи
description:
  long: |
    Фото, бейне және GIF-тен стикерлер мен эмоджи жаса. Қолмен түрлендірудің қажеті жоқ — бот бәрін өзі жасайды. @Stickers-тен де оңай.

    Мүмкіндіктер:
    • Жинақтарды басқару
    • Бейнестикерлер мен жеке эмоджи
    • Түпнұсқа файлдарды жүктеп алу
    • Стикерді/бейнені/GIF-ті суретке түрлендіру
    • Стикер жинақтарының каталогы

    Стикер іздеу: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Фото, бейне, GIF-тен стикерлер мен эмоджи жаса. Стикер каталогы және іздеу. 🇺🇦
ratelimit: Тым жиі!
