    web: |
      <b>📖 Бұл қалай жұмыс істейді</b>

      1. /new — жинақ жаса
      2. Фото, бейне, GIF немесе стикер жібер — тұтас альбоммен де болады
      3. /packs — жинақтарың және олардың баптаулары

      Нұсқаулықтар, кеңестер және FAQ — сайтта.
    menu: |
      <b>❓ Көмек</b>

      Тақырыпты таңда:
    create: |
      <b>🎨 Стикер жасау</b>

      1. Жинақ жасау үшін /new жібер
      2. Түрін таңда: кәдімгі, бейне немесе эмоджи
      3. Фото, бейне немесе GIF жібер
      4. Дайын! Бот бәрін өзі түрлендіреді

      <b>Пайдалы командалар:</b>
      • /clear — фотодан фонды жою
      • /round — бейнені бейнехатқа (дөңгелек) айналдыру
      • /frame — бейнестикердің пішіні:
        └ lite, medium, rounded, square, circle

      <b>💡 Кеңес:</b> Мөлдірлікті сақтау үшін PNG-ні <b>Файл</b> (📎) ретінде жібер. «Фото» режимі суретті сығып, мөлдірлікті жояды.
    manage: |
      <b>📁 Жинақтарды басқару</b>

      <b>Командалар:</b>
      • /packs — жинақтарыңның тізімі
      • /delete — стикерді жою
      • /copy — жинақты көшіру
      • /restore — жасырылған жинақтарды қалпына келтіру
      • /original — стикердің түпнұсқасын табу
      • /about — жинақ пен автор туралы ақпарат

      <b>Эмоджиді өзгерту:</b>
      Стикерді жібер → жаңа эмоджиді жібер.
      Немесе стикерді қосқан соң бірден эмоджи жібер.

      <b>Әдепкі эмоджи:</b>
      /emoji 🔥 — барлық жаңа стикерлерге осы эмоджи беріледі.

      <b>Топтарда:</b>
      /ss (медиаға жауап ретінде) — топ жинағына жылдам қосу.

      <b>Inline-жинақтар:</b>
      Сенің жеке топтамаң: сақталған стикерлерді, GIF, фото мен бейнелерді кез келген чатта жібер — @бот_аты деп жазып, керегін таңда.
      • Telegram стикерлеріне ештеңе қосылмайды — бәрі ботта сақталады
      • Стикерлер, фото, GIF, бейне сақтай алады
      • /packs → «Inline» қойындысында жаса
      • GIF іздеу режимі де бар (Tenor арқылы)

      <b>Бірлесіп өңдеу:</b>
      Жинақты бас → Бірлесіп өңдеу → сілтеме ал.
      Сілтемесі бар кез келген адам стикер қосып/жоя алады.
      Барлық қатысушыны шығару үшін сілтемені жаңарт.

      <b>Жинақ баптаулары:</b>
      /packs ішінде жинақты бас → қайта атау, Boost, бірлесіп өңдеу, жою.
    catalog: |
      <b>🔍 Каталог</b>

      • /catalog — танымал жинақтар
      • /publish — өз жинағыңды жариялау
      • Керемет жинақтарды алға шығару үшін баға бер
    boost: |
      <b>⚡ Boost</b>

      • Атауда "${titleSuffix}" болмайды
      • Бейнелер басымдықпен өңделеді
      • 35 секундқа дейінгі бейне
      • Бірнеше стикер бірден

      <b>🎨 Адаптивті эмоджи</b> — /new ішіндегі жинақтың бөлек түрі: эмоджи түсі мәтінге қарай өзгереді

      Алу → /donate
    problems: |
      <b>❓ FAQ</b>

      <b>⚫ Фон қара болып кетті ме?</b>
      «Фото» ретінде жіберсең, Telegram мөлдірлікті жояды.
      → PNG-ні <b>Файл</b> (📎 қыстырғыш) ретінде жібер.

      <b>🔄 Өзгерістер көрінбей ме?</b>
      Telegram стикерлерді кэштейді. ~1 сағат күт немесе қолданбаны қайта іске қос.

      <b>📹 Бейне қозғалмай ма?</b>
      Форматы әдеттен тыс болуы мүмкін. MP4-ке түрлендіріп көр немесе Бейне орнына Файл ретінде жібер.

      <b>🗑 Стикерді қалай жоюға болады?</b>
      /delete жібер, содан кейін стикерді бас.

      <b>🤏 Стикер тым кішкентай ма?</b>
      Жіберер алдында суретті шаршы етіп (1:1) қи.

      <b>🔗 Сілтемедегі "_by_fStikBot" бөлігін қалай алып тастауға болады?</b>
      Ешқалай. Жинақты қай бот жасағанын анықтау үшін Telegram осы жұрнақты талап етеді. Бұл біздің емес, платформаның ережесі.

      <b>💎 Premium керек пе?</b>
      • Жинақ жасау: тегін
      • Стикерлерді қолдану: тегін
      • Жеке эмоджи жіберу: тек Premium (Telegram ережесі)

      <b>Тағы сұрағың бар ма?</b> @fStikCommunity
