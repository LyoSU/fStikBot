  guide:
    web: |
      <b>📖 كيفية استخدام fStikBot</b>

      أدلة كاملة ونصائح وأسئلة شائعة على موقعنا.
    menu: |
      <b>❓ المساعدة</b>

      اختر موضوعًا:
    create: |
      <b>🎨 إنشاء الملصقات</b>

      1. أرسل /new لإنشاء حزمة
      2. اختر النوع: عادية أو فيديو أو إيموجي
      3. أرسل صورًا أو فيديوهات أو ملفات GIF
      4. انتهى! البوت يحوّل كل شيء بنفسه

      <b>أوامر مفيدة:</b>
      • /clear — إزالة الخلفية من الصورة
      • /round — تحويل الفيديو إلى رسالة فيديو دائرية
      • /frame — شكل ملصق الفيديو:
        └ lite, medium, rounded, square, circle

      <b>💡 نصيحة:</b> أرسل PNG <b>كملف</b> (📎) للحفاظ على الشفافية. وضع «صورة» يضغط الصورة ويزيل الشفافية.
    manage: |
      <b>📁 إدارة الحزم</b>

      <b>الأوامر:</b>
      • /packs — قائمة حزمك
      • /delete — حذف ملصق
      • /copy — نسخ حزمة
      • /restore — استعادة الحزم المخفية
      • /original — العثور على الملصق الأصلي
      • /about — معلومات عن الحزمة ومنشئها

      <b>تغيير الإيموجي:</b>
      أرسل الملصق → ثم أرسل الإيموجي الجديد.
      أو أرسل الإيموجي مباشرة بعد الإضافة.

      <b>الإيموجي الافتراضي:</b>
      /emoji 🔥 — ستحصل كل الملصقات الجديدة على هذا الإيموجي.

      <b>في المجموعات:</b>
      /ss (ردًا على وسائط) — إضافة سريعة إلى حزمة المجموعة.

      <b>الحزم المضمّنة:</b>
      نوع منفصل من الحزم للوصول السريع عبر @اسم_البوت في أي دردشة.
      • ليست حزمة حقيقية في Telegram — تُحفظ في البوت فقط
      • يمكن أن تحتوي على ملصقات وصور وGIF وفيديوهات
      • أنشئها في /packs → تبويب «مضمّنة»
      • يتوفر أيضًا وضع البحث عن GIF (عبر Tenor)

      <b>التحرير المشترك:</b>
      اضغط على الحزمة → تحرير مشترك → احصل على الرابط.
      يمكن لأي شخص لديه الرابط إضافة الملصقات وحذفها.
      أعد تعيين الرابط لإزالة جميع المحررين.

      <b>خيارات الحزمة:</b>
      اضغط على حزمة في /packs → إعادة التسمية، التعزيز، التحرير المشترك، الحذف.
    catalog: |
      <b>🔍 الكتالوج</b>

      • /catalog — الحزم الأكثر شعبية
      • /publish — انشر حزمتك
      • قيّم الحزم لتساعد أفضلها على الانتشار
    boost: |
      <b>⚡ التعزيز</b>

      • بدون "${titleSuffix}" في الاسم
      • أولوية في معالجة الفيديو
      • فيديو حتى 30 ثانية
      • عدة ملصقات في قائمة الانتظار

      <b>الإيموجي التكيّفي</b> — زر منفصل في /new (يتغير لونه حسب لون النص)

      للحصول عليه → /donate
    problems: |
      <b>❓ الأسئلة الشائعة</b>

      <b>⚫ أصبحت الخلفية سوداء؟</b>
      يزيل Telegram الشفافية إذا أرسلت الملف كـ«صورة».
      → أرسل PNG <b>كملف</b> (📎 مشبك الورق).

      <b>🔄 التغييرات لا تظهر؟</b>
      يخزّن Telegram الملصقات مؤقتًا. انتظر ساعة تقريبًا أو أعد تشغيل التطبيق.

      <b>📹 الفيديو لا يتحرك؟</b>
      غالبًا صيغته غير مألوفة. جرّب تحويله إلى MP4 أو أرسله كملف بدلًا من فيديو.

      <b>🗑 كيف أحذف ملصقًا؟</b>
      أرسل /delete، ثم اضغط على الملصق.

      <b>🤏 الملصق صغير جدًا؟</b>
      قُصّ الصورة إلى مربع (1:1) قبل الإرسال.

      <b>🔗 كيف أزيل "_by_fStikBot" من الرابط؟</b>
      لا يمكن ذلك. يشترط Telegram هذه اللاحقة لمعرفة البوت الذي أنشأ الحزمة. هذه قاعدة المنصة، وليست قاعدتنا.

      <b>💎 هل أحتاج إلى Telegram المميز؟</b>
      • إنشاء الحزم: مجانًا
      • استخدام الملصقات: مجانًا
      • إرسال الإيموجي المخصص: لمشتركي المميز فقط (قاعدة Telegram)

      <b>لديك أسئلة أخرى؟</b> @fStikCommunity
