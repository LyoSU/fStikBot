    web: |
      <b>📖 كيف يعمل البوت</b>

      1. /new — أنشئ حزمة
      2. أرسل صورًا أو مقاطع فيديو أو صورًا متحركة أو ملصقات — حتى ألبومًا كاملًا
      3. /packs — حزمك وإعداداتها

      الأدلة والنصائح والأسئلة الشائعة متوفرة على موقعنا.
    menu: |
      <b>❓ المساعدة</b>

      اختر موضوعًا:
    create: |
      <b>🎨 إنشاء الملصقات</b>

      1. أرسل /new لإنشاء حزمة
      2. اختر النوع: عادية أو فيديو أو رموز تعبيرية
      3. أرسل صورًا أو مقاطع فيديو أو صورًا متحركة
      4. تم! يتولى البوت تحويل كل شيء تلقائيًا

      <b>أوامر مفيدة:</b>
      • /clear — إزالة الخلفية من الصورة
      • /round — تحويل الفيديو إلى رسالة مرئية دائرية
      • /frame — شكل ملصق الفيديو:
        └ lite, medium, rounded, square, circle

      <b>💡 نصيحة:</b> أرسل بصيغة PNG <b>كملف</b> (📎) للحفاظ على الشفافية؛ فإرسالها كـ «صورة» يضغطها ويزيل الشفافية.
    manage: |
      <b>📁 إدارة الحزم</b>

      <b>الأوامر:</b>
      • /packs — قائمة حزمك
      • /delete — حذف ملصق
      • /copy — نسخ حزمة
      • /restore — استعادة الحزم المخفية
      • /original — العثور على الملصق الأصلي
      • /about — معلومات عن الحزمة ومنشئها

      <b>تغيير الرمز التعبيري:</b>
      أرسل الملصق ← ثم أرسل الرمز التعبيري الجديد.
      أو أرسل الرمز التعبيري مباشرة بعد إضافة الملصق.

      <b>الرمز التعبيري الافتراضي:</b>
      /emoji 🔥 — ستحصل كل الملصقات الجديدة على هذا الرمز التعبيري.

      <b>في المجموعات:</b>
      /ss (بالرد على وسائط) — إضافة سريعة إلى حزمة المجموعة.

      <b>الحزم المضمنة:</b>
      مجموعتك الخاصة: أرسل الملصقات والصور المتحركة والصور ومقاطع الفيديو في أي محادثة — اكتب @اسم_البوت واختر ما تريد.
      • لا يُضاف أي شيء إلى ملصقاتك في Telegram — كل شيء يُحفظ في البوت
      • يمكن أن تحتوي على ملصقات وصور وصور متحركة ومقاطع فيديو
      • أنشئها عبر /packs ← تبويب «مضمنة»
      • يتوفر أيضًا وضع للبحث عن الصور المتحركة (عبر Tenor)

      <b>التحرير المشترك:</b>
      اضغط على الحزمة ← تحرير مشترك ← انسخ الرابط.
      يمكن لأي شخص لديه الرابط إضافة الملصقات وحذفها.
      أعد تعيين الرابط لإلغاء وصول جميع المتعاونين.

      <b>خيارات الحزمة:</b>
      اضغط على حزمة في /packs ← إعادة التسمية، Boost، التحرير المشترك، الحذف.
    catalog: |
      <b>🔍 الكتالوج</b>

      • /catalog — الحزم الشائعة
      • /publish — انشر حزمتك
      • قيّم الحزم لمساعدة الحزم المميزة على الظهور
    boost: |
      <b>⚡ Boost</b>

      • بدون «${titleSuffix}» في الاسم
      • أولوية في معالجة الفيديو
      • فيديو حتى 35 ثانية
      • إضافة عدة ملصقات دفعة واحدة

      <b>🎨 رموز متكيفة</b> — نوع حزم منفصل في /new: يتغير لون الرمز التعبيري تلقائيًا ليطابق لون النص

      للحصول عليه ← /donate
    problems: |
      <b>❓ الأسئلة الشائعة</b>

      <b>⚫ هل تحولت الخلفية إلى اللون الأسود؟</b>
      يحذف Telegram الشفافية إذا أرسلت الملف كـ «صورة».
      ← أرسل ملف PNG كـ <b>ملف</b> (📎 مشبك الورق).

      <b>🔄 التعديلات لا تظهر؟</b>
      يقوم Telegram بتخزين الملصقات مؤقتًا. انتظر نحو ساعة أو أعد تشغيل التطبيق.

      <b>📹 الفيديو لا يتحرك؟</b>
      السبب على الأرجح صيغة غير مدعومة. جرّب تحويله إلى MP4 أو أرسله كملف بدلًا من فيديو.

      <b>🗑 كيف أحذف ملصقًا؟</b>
      أرسل /delete، ثم اضغط على الملصق.

      <b>🤏 الملصق صغير جدًا؟</b>
      قص الصورة لتصبح مربعة (1:1) قبل إرسالها.

      <b>🔗 كيف أزيل «_by_fStikBot» من الرابط؟</b>
      لا يمكن ذلك؛ يشترط Telegram هذه اللاحقة لمعرفة البوت الذي أنشأ الحزمة. هذه قاعدة المنصة وليست قاعدتنا.

      <b>💎 هل أحتاج إلى Telegram Premium؟</b>
      • إنشاء الحزم: مجانًا
      • استخدام الملصقات: مجانًا
      • إرسال الرموز المخصصة: لمشتركي تيليجرام المُميّز فقط (وفقًا لقواعد Telegram)

      <b>لديك أسئلة أخرى؟</b> @fStikCommunity
