news:
  join: |
    📢 <a href="${link}">Suscríbete al canal</a>: noticias, actualizaciones y nuevas funciones.
  join_btn: '📢 Suscribirse'
  not_joined: '🙅 No estás suscrito al canal'
  continue: '✅ Continuar'
userAbout:
  help: |
    <b>🧑‍🎨 Sobre el usuario</b>

    Con este menú puedes ver información sobre un usuario y sus paquetes de stickers

    Para obtenerla, usa el botón de abajo o reenvía un mensaje suyo
  result: |
    <b>🧑‍🎨 Información del usuario</b>
    <b>🆔 ID de usuario:</b> <code>${userId}</code>
    <b>🎨 Paquetes de este usuario:</b>
    ${packs}
  no_packs: |
    <i>No tenemos información sobre los paquetes de este usuario</i>
  forward_hidden: |
    El usuario no permite reenviar sus mensajes. Usa el botón de abajo para ver sus paquetes de stickers.
  select_user: '🧑‍🎨 Elegir usuario'
scenes:
  new_pack:
    pack_type: |
      <b>¿Qué paquete creamos?</b>

      <b>🖼 Stickers</b> — los clásicos, para enviar en el chat.
      <b>✨ Emojis</b> — emojis personalizados dentro del texto. Solo los usuarios de Telegram Premium pueden enviarlos.
      <b>🎨 Emojis adaptativos</b> — monocromos: se dibujan en un solo color y se adaptan solos al color del texto.
    regular: '😊 Sticker'
    custom_emoji: '✨ Emojis'
    custom_emoji_adaptive: '🎨 Emojis adaptativos'
    pack_title: |
      <b>Nombre del paquete</b>

      Lo verán todos. Escribe uno o elige una de las sugerencias de abajo.
      <i>La dirección del paquete la crearé a partir del nombre.</i>
    pack_name: |
      <b>Dirección del paquete</b>

      Solo letras latinas, números y <code>_</code>. Por ejemplo: t.me/addstickers/<u>MisStickers</u>
    ok: |
      ✅ Paquete creado: <a href="${link}">${title}</a>

      Envía una foto, un video o un sticker para añadirlo.
    error:
      title_long: El nombre no puede tener más de ${max} caracteres.
      name_long: La dirección no puede tener más de ${max} caracteres.
      inline_exists: |
        Ya tienes un paquete inline: <b>${title}</b>.

        Solo puedes tener un paquete inline: crear otro borraría este.
        Ya está seleccionado, así que sigue añadiendo stickers.
      telegram:
        name_invalid: Esa dirección no se puede usar.
        name_occupied: Esta dirección ya está ocupada. Prueba otra.
        upload_failed: |
          El bot no puede subir los stickers a Telegram.

          Inténtalo más tarde.
    btn:
      custom_link: '🔗 Mi propia dirección'
    custom_link_on: 'Vale: envía el nombre y después te pediré la dirección.'
  copy:
    enter: |
      Primero, creemos un paquete nuevo para la copia.
    progress: |
      ⏳ Copiando: ${current}/${total}
    done: |
      ✅ Copiado en <a href="${link}">${title}</a>
    done_partial: |
      ⚠️ Copiado en <a href="${link}">${title}</a>

      ${success} stickers copiados, ${failed} no se pudieron copiar.
    done_pending: |
      ✅ Copiado en <a href="${link}">${title}</a>

      ${success} stickers copiados, ${pending} videos aún en proceso.
    done_partial_pending: |
      ⚠️ Copiado en <a href="${link}">${title}</a>

      ${success} stickers copiados, ${failed} fallidos, ${pending} videos aún en proceso.
    pay: |
      <b>Conversión de paquete</b>

      Convertir un paquete de un tipo a otro cuesta 1 crédito

      <b>Saldo actual:</b> ${balance} créditos

      Comprar créditos: /donate
    pay_btn: '✅ Confirmar'
    error:
      all_failed: |
        ❌ No se pudo copiar ningún sticker de <a href="${originalLink}">${originalTitle}</a>.

        No se creó el paquete.
      premium: |
        Lo sentimos, esta función solo está disponible para quienes han apoyado al bot.

        Puedes hacerlo con el comando /donate.
    title: |
      <b>📋 Copiando <a href="${originalLink}">${originalTitle}</a></b> (${count})

      Nombre para tu copia: escribe uno o elige uno de abajo.
    btn:
      change_type: '🔄 Cambiar tipo de paquete'
    created: |
      ✅ Paquete creado: <a href="${link}">${title}</a>

      Copiando los stickers; te avisaré cuando termine.
  original:
    enter: |
      <b>🔎 Origen del sticker</b>

      Envía un sticker y te mostraré de qué paquete se copió.
      Si no se encuentra el original, recibirás el archivo (PNG/WEBM).
    source_found: |
      🔎 Copiado de: <a href="${link}">${title}</a>
    error:
      not_found: |
        No se encontró el original. Aquí tienes el archivo del sticker:
  delete:
    enter: |
      <b>🗑 Eliminar sticker</b>

      Envía un sticker y lo eliminaré de su paquete al instante (podrás restaurarlo). Envía todos los que quieras.
    confirm: |
      ¿Eliminar este sticker del paquete?
    error:
      not_found: |
        El sticker no está en la base de datos. Puede que no se haya creado con este bot.
  rename:
    enter_name: |
      Nuevo nombre para <a href="${link}">${title}</a>:
    success: |
      ✅ Renombrado: <a href="${link}">${title}</a>
    boost_notice: |
      El boost quitará "${titleSuffix}" → /donate
  packAbout:
    enter: |
      <b>🔎 Autor del sticker</b>

      Envía un sticker y te mostraré el paquete, su autor y sus otros paquetes.
      O reenvía un mensaje y te mostraré los paquetes de esa persona.
    not_found: |
      Sticker no encontrado.
    btn:
      download: '📎 Descargar archivo'
      show_all_packs: '📦 Todos los paquetes (${count})'
    result: |
      <b>📦 Paquete:</b> <a href="${link}">${name}</a>
      🔢 Stickers: <code>${stickerCount}</code> | 🏷 #<code>${setId}</code> | ${dcId}

      🧑‍🎨 ID del propietario: <code>${ownerId}</code>
      ${mention}

      <b>🎨 Otros paquetes de este propietario:</b>
      ${otherPacks}
    no_other_packs: |
      <i>No tenemos información sobre otros paquetes de este propietario</i>
    unknown_owner: '<i>Desconocido</i>'
    hidden: '<i>[oculto]</i>'
  boost:
    sure: |
      ¿Aplicar boost a <a href="${link}">${title}</a>?

      <b>Precio:</b> 1 crédito
      <b>Saldo:</b> ${balance}
    btn:
      yes: '⚡ Aplicar boost'
      no: Cancelar
      buy: '⭐ Comprar créditos'
    canceled: |
      Cancelado
    success: |
      ⚡ <a href="${link}">${title}</a>: ¡boost activado!

      <b>Desbloqueado:</b>
      • Nombre sin el sufijo «${titleSuffix}» (tras renombrar)
      • Hasta 64 caracteres en el nombre (en lugar de 35)
      • Videos de hasta 35 segundos
      • Prioridad en la conversión
      • Varios stickers a la vez

      <i>Para quitar el sufijo, toca «✏️ Renombrar» en el menú del paquete.</i>
    error:
      too_fast: 'No tan rápido: inténtalo de nuevo en un segundo.'
      not_enough_credits: |
        No tienes suficientes créditos. /donate
      already_boosted: |
        Este paquete ya tiene boost.
  catalog:
    publish:
      publish_new: |
        👌 <b>Envía un sticker del paquete que quieres publicar</b>

        <i>Puedes publicar cualquier paquete tuyo, aunque lo hayas creado en otro lugar</i>
      owner_proof: |
        <b>Para confirmar que el paquete es tuyo, sigue estos sencillos pasos:</b>
        1. Abre el bot @Stickers
        2. Envía el comando <code>/packstats</code>
        3. Busca y elige el paquete
        4. Reenvíame el mensaje que recibas
      publish_new_access_denied: |
        Este paquete no es tuyo.

        Solo puedes publicar tus propios paquetes
      banned: |
        No puedes usar esta función.
        Contacta con el administrador.
      enter: |
        ¿Publicar <a href="${link}">${title}</a> en el catálogo?

        Otros usuarios podrán encontrar tu paquete por nombre o etiquetas.

        <b>Reglas:</b>
        • Solo paquetes de calidad para un público amplio
        • Nada de fotos personales ni contenido privado
        • Nada que infrinja la ley
      continue_button: Continuar
      enter_description: |
        <b>Describe brevemente tu paquete para que otros puedan encontrarlo</b>

        <i>Puedes usar hashtags para categorizarlo [#]</i>
        <i>Por ejemplo: #anime #meme #animals #cute #kpop #funny #cat #game</i>
      current_description: |

        <b>Descripción actual:</b> <i>${description}</i>
      keep_description: '✅ Mantener la descripción actual'
      select_language: |
        <b>Elige los idiomas a los que va dirigido tu paquete:</b>
        <i>Puedes elegir varios</i>
      button_all_languages: Cualquier idioma
      button_confirm_language: Confirmar
      set_safe: |
        <b>¿Tu paquete es apto para todos?</b>
        <i>Es decir, no contiene erotismo, violencia ni otro contenido para mayores de 18</i>
      button_safe:
        safe: '✅ Sí, sin 18+'
        not_safe: '🔞 No, tiene contenido 18+'
      no_tags: sin especificar
      confirm: |
        <b>Confirma la publicación del paquete «<a href="${link}">${title}</a>»</b>

        <b>Descripción:</b> <i>${description}</i>

        <b>Etiquetas:</b> ${tags}
        <b>Idiomas:</b> ${languages}
      button_confirm: '✅ Confirmar publicación'
      success: |
        ¡Enhorabuena! Tu paquete ya está publicado en el catálogo y otros usuarios podrán encontrarlo.

        Puedes editar su información desde /packs.

        <i>Puedes ver las estadísticas de tu paquete con el bot oficial @Stickers</i>
    unpublish:
      success: |
        El paquete se quitó del catálogo.
  delete_pack:
    enter: |
      ⚠️ ¿Eliminar <a href="${link}">${title}</a> para siempre?

      Pulsa «${confirm}» para confirmar o «Cancelar».
    confirm: Sí, eliminar
    success: |
      🗑 Paquete eliminado
    error:
      - Algo salió mal.
  frame:
    no_sticker_set: |
      Todavía no has elegido un paquete. Elígelo con /packs y repite el comando.
    no_video: |
      Solo puedes añadir un marco a los paquetes de stickers de video.
    select_type: |
      <a href="${example}">&#8203;</a><b>Elige la forma del sticker:</b>

      <code>ligera</code> — casi sin redondeo
      <code>media</code> — esquinas ligeramente redondeadas
      <code>redondeada</code> — esquinas muy redondeadas
      <code>cuadrada</code> — esquinas rectas, sin redondeo
      <code>circular</code> — sticker en forma de círculo

      <i>Puedes cambiar la forma con el comando /frame</i>
    types:
      lite: '1. Ligera'
      medium: '2. Media'
      rounded: '3. Redondeada'
      square: '4. Cuadrada'
      circle: '5. Circular'
    selected: |
      <b>Tipo de marco elegido:</b> ${type}
  photoClear:
    enter: |
      <b>✂️ Quitar fondo</b>

      Envía una foto y recibirás un PNG sin fondo.
      <i>Modelo para tus fotos:</i>
    enter_anime: |
      <b>✂️ Quitar fondo</b>

      Envía una foto y recibirás un PNG sin fondo.
      <i>Funciona mejor con anime.</i>
    choose_model: |
      Modelo:
    web_app: WebApp — para fotos de personas
    model:
      ordinary: Normal — para fotos de personas
      general: General — para cualquier foto
      anime: Anime — para imágenes de anime
      birefnet_general: BirefNet — para cualquier foto
    add_to_set_btn: '🌟 Añadir al paquete'
    error: |
      Uy, algo salió mal. Inténtalo de nuevo.
    error_timeout: |
      ⏱ El procesamiento tardó demasiado. Inténtalo más tarde o con una foto más pequeña.
    error_queue_disabled: |
      Esta función no está disponible temporalmente. Inténtalo más tarde.
    not_image: 'Envía una foto o una imagen como archivo (PNG, JPEG, WebP).'
  videoRound:
    enter: |
      <b>⭕ Video circular</b>

      Envía un video y lo convertiré en un video circular.
    not_video: |
      Envía un video, un GIF, un sticker de video o una imagen animada.
    error: |
      No se pudo convertir. Prueba con otro video.
    forbidden: |
      No puedo enviarte el video circular. Revisa tu configuración de privacidad (debes permitir los mensajes de voz).
    processing: |
      ⏳ Convirtiendo: ${position}/${total}

      <i>Boost = prioridad → /donate</i>
    file_too_big: |
      El archivo es demasiado grande (máx. 20 MB). Envía un video más pequeño.
  search:
    error:
      not_found: |
        No se encontró nada. Prueba con otras palabras clave.
    enter: |
      <b>🔍 Buscar stickers</b>

      Escribe palabras clave y buscaré paquetes en el catálogo.
  error:
    notFound: Paquete no encontrado
  leave: |
    Cancelado
  btn:
    cancel: '← Cancelar'
  unexpected: 'Ahora mismo espero otra cosa: sigue el paso de arriba o pulsa «← Cancelar».'
error:
  stickerset_invalid: |
    El paquete no está disponible. Puede que se haya eliminado en Telegram.
  telegram: |
    Error de Telegram: <code>${error}</code>
  telegram_reasons:
    sticker_not_in_set: |
      El sticker ya no está en el paquete; puede que se haya eliminado antes.
    pack_invalid: |
      El paquete de stickers no está disponible. Puede que se haya eliminado en Telegram.
    pack_full: |
      El paquete está lleno (se alcanzó el límite de Telegram). Elimina algunos stickers e inténtalo de nuevo.
    not_pack_owner: |
      Este paquete pertenece a otro usuario: no puedes modificarlo.
    pack_name_taken: |
      Esa dirección de paquete ya está ocupada. Elige otro nombre.
    pack_name_invalid: |
      La dirección del paquete tiene un formato no válido. Solo se permiten letras latinas, números y el guion bajo (_).
    invalid_sticker_format: |
      El archivo no sirve como sticker: formato o tamaño incorrecto.
    invalid_emoji: |
      El emoji no es válido. Envía un emoji Unicode estándar.
    rate_limited: |
      Telegram pide esperar: inténtalo de nuevo en unos segundos.
    cannot_reach_user: |
      No puedo escribir al usuario: el bot está bloqueado o el chat no está disponible.
  answerCbQuery:
    telegram: |
      Telegram dió un error:
      ${error}
  file_too_big: |
    El archivo es demasiado grande (máx. 20 MB).
  download: |
    No se pudo descargar el archivo. Inténtalo de nuevo.
  banned: |
    🚫 Acceso denegado. Dudas → @ly_oBot
  access_denied: Acceso denegado
  unknown: |
    Algo salió mal. Inténtalo de nuevo.

    ¿Sigue sin funcionar? Escribe a @Ly_oBot
  rate_limit: |
    ⏳ Demasiadas solicitudes. Espera un momento e inténtalo de nuevo.
  rate_limit_seconds: |
    ⏳ Demasiadas solicitudes. Espera ${seconds} segundos.
