---
language_name: '🇪🇸 Español'
name: fStik — Stickers y emojis
description:
  long: |
    Crea stickers y emojis a partir de fotos, videos y GIFs. Sin conversión manual: el bot lo hace todo. Más fácil que @Stickers.

    Funciones:
    • Gestión de paquetes
    • Stickers de video y emojis personalizados
    • Descarga de originales
    • Conversión de sticker/video/GIF a imagen
    • Catálogo de stickers

    Buscar stickers: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Crea stickers y emojis a partir de fotos, videos y GIFs. Catálogo y búsqueda de stickers. 🇺🇦
ratelimit: '¡Demasiado seguido!'
