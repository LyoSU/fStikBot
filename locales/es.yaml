  guide:
    web: |
      <b>📖 Cómo funciona</b>

      1. /new — crea un paquete
      2. Envía fotos, vídeos, GIF o stickers, incluso un álbum entero
      3. /packs — tus paquetes y sus ajustes

      Guías, consejos y preguntas frecuentes en el sitio web.
    menu: |
      <b>❓ Ayuda</b>

      Elige un tema:
    create: |
      <b>🎨 Crear stickers</b>

      1. Envía /new para crear un paquete
      2. Elige el tipo: normal, video o emoji
      3. Envía fotos, videos o GIFs
      4. ¡Listo! El bot lo convierte todo solo

      <b>Comandos útiles:</b>
      • /clear — quitar el fondo de una foto
      • /round — convertir un video en círculo
      • /frame — forma del sticker de video:
        └ lite, medium, rounded, square, circle

      <b>💡 Consejo:</b> Envía los PNG como <b>Archivo</b> (📎) para conservar la transparencia. El modo «Foto» los comprime y la elimina.
    manage: |
      <b>📁 Gestión de paquetes</b>

      <b>Comandos:</b>
      • /packs — lista de tus paquetes
      • /delete — eliminar un sticker
      • /copy — copiar un paquete
      • /restore — recuperar paquetes ocultos
      • /original — encontrar el original de un sticker
      • /about — info del paquete y de su autor

      <b>Cambiar el emoji:</b>
      Envía el sticker → envía el nuevo emoji.
      O envía el emoji justo después de añadirlo.

      <b>Emoji predeterminado:</b>
      /emoji 🔥 — todos los stickers nuevos lo tendrán.

      <b>En grupos:</b>
      /ss (respondiendo a una foto o video) — añadir rápido al paquete del grupo.

      <b>Paquetes inline:</b>
      Tu colección personal: envía los stickers, GIFs, fotos y videos que guardaste en cualquier chat — escribe @nombre_del_bot y elige lo que quieras.
      • No se añade nada a tus stickers de Telegram: todo se guarda en el bot
      • Puede contener stickers, fotos, GIFs y videos
      • Créalo en /packs → pestaña «Inline»
      • También tiene un modo de búsqueda de GIFs (con Tenor)

      <b>Edición conjunta:</b>
      Toca el paquete → Edición conjunta → obtén un enlace.
      Cualquiera con el enlace puede añadir o eliminar stickers.
      Restablece el enlace para quitar a todos los editores.

      <b>Opciones del paquete:</b>
      Toca un paquete en /packs → renombrar, boost, edición conjunta, eliminar.
    catalog: |
      <b>🔍 Catálogo</b>

      • /catalog — paquetes populares
      • /publish — publicar tu paquete
      • Valora paquetes para destacar los mejores
    boost: |
      <b>⚡ Boost</b>

      • Sin "${titleSuffix}" en el nombre
      • Procesamiento prioritario de videos
      • Videos de hasta 35 s
      • Varios stickers a la vez

      <b>🎨 Emojis adaptativos</b> — un tipo de paquete aparte en /new: los emojis cambian de color según el texto

      Consíguelo → /donate
    problems: |
      <b>❓ Preguntas frecuentes</b>

      <b>⚫ ¿El fondo se volvió negro?</b>
      Telegram elimina la transparencia si lo envías como «Foto».
      → Envía los PNG como <b>Archivo</b> (📎 clip).

      <b>🔄 ¿No se ven los cambios?</b>
      Telegram guarda los stickers en caché. Espera ~1 hora o reinicia la app.

      <b>📹 ¿El video no se anima?</b>
      Seguramente tiene un formato poco común. Conviértelo a MP4 o envíalo como Archivo en lugar de Video.

      <b>🗑 ¿Cómo elimino un sticker?</b>
      Envía /delete y luego toca el sticker.

      <b>🤏 ¿El sticker queda muy pequeño?</b>
      Recorta la imagen en cuadrado (1:1) antes de enviarla.

      <b>🔗 ¿Cómo quito "_by_fStikBot" del enlace?</b>
      No se puede. Telegram exige este sufijo para saber qué bot creó el paquete. Es una regla de la plataforma, no nuestra.

      <b>💎 ¿Necesito Premium?</b>
      • Crear paquetes: gratis
      • Usar stickers: gratis
      • Enviar emojis personalizados: solo con Premium (regla de Telegram)

      <b>¿Más preguntas?</b> @fStikCommunity
