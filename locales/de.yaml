    web: |
      <b>📖 So funktioniert’s</b>

      1. /new — Paket erstellen
      2. Sende Fotos, Videos, GIFs oder Sticker — auch als ganzes Album
      3. /packs — deine Pakete und Einstellungen

      Anleitungen, Tipps und FAQ findest du auf der Website.
    menu: |
      <b>❓ Hilfe</b>

      Wähle ein Thema:
    create: |
      <b>🎨 Sticker erstellen</b>

      1. Sende /new, um ein Paket zu erstellen
      2. Wähle den Typ: normal, Video oder Emoji
      3. Sende Fotos, Videos oder GIFs
      4. Fertig! Der Bot konvertiert alles automatisch

      <b>Nützliche Befehle:</b>
      • /clear — Hintergrund vom Foto entfernen
      • /round — Video in eine Videonachricht (Kreis) umwandeln
      • /frame — Form des Video-Stickers:
        └ lite, medium, rounded, square, circle

      <b>💡 Tipp:</b> Sende PNGs als <b>Datei</b> (📎), damit die Transparenz erhalten bleibt. Im Modus „Foto“ wird das Bild komprimiert und die Transparenz geht verloren.
    manage: |
      <b>📁 Pakete verwalten</b>

      <b>Befehle:</b>
      • /packs — Liste deiner Pakete
      • /delete — Sticker löschen
      • /copy — Paket kopieren
      • /restore — ausgeblendete Pakete wiederherstellen
      • /original — Original eines Stickers finden
      • /about — Infos zu Paket und Ersteller

      <b>Emoji ändern:</b>
      Sende den Sticker → sende das neue Emoji.
      Oder sende das Emoji direkt nach dem Hinzufügen.

      <b>Standard-Emoji:</b>
      /emoji 🔥 — alle neuen Sticker bekommen dieses Emoji.

      <b>In Gruppen:</b>
      /ss (als Antwort auf ein Medium) — schnell zum Gruppen-Paket hinzufügen.

      <b>Inline-Pakete:</b>
      Deine persönliche Sammlung: Sende gespeicherte Sticker, GIFs, Fotos und Videos in jedem Chat — tippe @botname und wähle das Passende aus.
      • Zu deinen Telegram-Stickern wird nichts hinzugefügt — alles wird im Bot gespeichert
      • Kann Sticker, Fotos, GIFs und Videos enthalten
      • Erstellen unter /packs → Tab „Inline“
      • Mit GIF-Suchmodus (über Tenor)

      <b>Gemeinsam bearbeiten:</b>
      Tippe auf ein Paket → Freigabe → du bekommst einen Link.
      Jeder mit dem Link kann Sticker hinzufügen und löschen.
      Setze den Link zurück, um den Zugriff für alle zu widerrufen.

      <b>Paket-Optionen:</b>
      Tippe in /packs auf ein Paket → umbenennen, boosten, Freigabe, löschen.
    catalog: |
      <b>🔍 Katalog</b>

      • /catalog — beliebte Pakete
      • /publish — eigenes Paket veröffentlichen
      • Bewerte Pakete, damit gute nach oben kommen
    boost: |
      <b>⚡ Boost</b>

      • Ohne "${titleSuffix}" im Namen
      • Bevorzugte Videoverarbeitung
      • Videos bis zu 35 Sek.
      • Mehrere Sticker gleichzeitig

      <b>🎨 Adaptive Emoji</b> — eigener Paket-Typ in /new: Die Emoji passen ihre Farbe an den Text an

      Holen → /donate
    problems: |
      <b>❓ FAQ</b>

      <b>⚫ Hintergrund ist schwarz geworden?</b>
      Telegram entfernt die Transparenz, wenn du ein Bild als „Foto“ sendest.
      → Sende PNGs als <b>Datei</b> (📎 Büroklammer).

      <b>🔄 Änderungen nicht sichtbar?</b>
      Telegram speichert Sticker im Cache. Warte ca. 1 Stunde oder starte die App neu.

      <b>📹 Video wird nicht animiert?</b>
      Wahrscheinlich ein ungewöhnliches Format. Konvertiere es in MP4 oder sende es als Datei statt als Video.

      <b>🗑 Wie lösche ich einen Sticker?</b>
      Sende /delete und tippe dann auf den Sticker.

      <b>🤏 Sticker zu klein?</b>
      Schneide das Bild vor dem Senden quadratisch (1:1) zu.

      <b>🔗 Wie entferne ich "_by_fStikBot" aus dem Link?</b>
      Gar nicht. Telegram verlangt dieses Suffix, um zu erkennen, welcher Bot das Paket erstellt hat. Das ist eine Regel der Plattform, nicht unsere.

      <b>💎 Brauche ich Premium?</b>
      • Pakete erstellen: kostenlos
      • Sticker verwenden: kostenlos
      • Angepasste Emoji senden: nur mit Premium (Telegram-Regel)

      <b>Noch Fragen?</b> @fStikCommunity
