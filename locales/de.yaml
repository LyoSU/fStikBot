---
language_name: '🇩🇪 Deutsch'
name: fStik — Sticker & Emojis
description:
  long: |
    Erstelle Sticker und Emoji aus Fotos, Videos und GIFs. Keine manuelle Konvertierung — der Bot erledigt alles von selbst. Einfacher als @Stickers.

    Funktionen:
    • Pakete verwalten
    • Video-Sticker & angepasste Emoji
    • Originaldateien herunterladen
    • Sticker/Video/GIF in Bild umwandeln
    • Sticker-Katalog

    Sticker suchen: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Erstelle Sticker und Emoji aus Fotos, Videos, GIFs. Sticker-Katalog und Suche. 🇺🇦
ratelimit: Nicht so oft!
