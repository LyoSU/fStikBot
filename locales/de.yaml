language_name: '🇩🇪 Deutsch'
name: fStik — Sticker & Emojis
description:
  long: |
    Erstelle Sticker und Emojis aus Fotos, Videos und GIFs. Keine manuelle Konvertierung — der Bot erledigt alles für dich. Einfacher als @Stickers.

    Funktionen:
    • Sets verwalten
    • Video-Sticker und benutzerdefinierte Emojis
    • Originaldateien herunterladen
    • Sticker/Video/GIF in ein Bild umwandeln
    • Sticker-Katalog

    Sticker suchen: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Erstelle Sticker und Emojis aus Fotos, Videos, GIFs. Sticker-Katalog und Suche. 🇺🇦
ratelimit: Nicht so oft!
