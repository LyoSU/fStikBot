---
language_name: '🇺🇦 Українська'
name: fStik — Стікери та емодзі
description:
  long: |
    Створюй стікери та емодзі з фото, відео і GIF. Без ручної конвертації — бот зробить усе сам. Простіше, ніж @Stickers.

    Можливості:
    • Керування паками
    • Відеостікери та користувацькі емодзі
    • Завантаження оригінальних файлів
    • Конвертація стікера/відео/GIF у зображення
    • Каталог стікерів

    Пошук стікерів: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Створюй стікери та емодзі з фото, відео, GIF. Каталог і пошук стікерів. 🇺🇦
ratelimit: Занадто часто!
cmd:
  start:
    enter: |
      Привіт, ${name}!
      Створюю стікери та емодзі з фото, відео і GIF.

      💬 @StickLyUA
    group: |
      Привіт, ${groupTitle}! Я створюю стікери та емодзі.

      Щоб додати стікер до паку групи, надішли /ss у відповідь на фото, відео, GIF або стікер.
    catalog: |
      <b>🔍 Каталог стікерів</b>

      Шукай паки за ключовими словами або переглядай популярні.
      Оцінюй паки, щоб допомогти іншим знайти класні.
    search_catalog: |
      <b>🌐 Каталог паків</b>

      Переглядай чужі паки або публікуй власні:
    commands:
      ss: '➕ Додати в пак групи'
      start: '📜 Меню'
      help: '❓ Допомога'
