      catalog_app: '📱 Завантажити для Android'
      catalog_app_mini: '📱 Додаток для Android'
    current_pack: '📦 Стікери додаються до: <a href="${link}">${title}</a>'
    hint: 'Надішли фото, відео, GIF або стікер — додам до <a href="${link}">${title}</a>.'
  guide:
    web: |
      <b>📖 Як це працює</b>

      1. /new — створи пак
      2. Надсилай фото, відео, GIF або стікери — навіть цілим альбомом
      3. /packs — твої паки та їхні налаштування

      Гайди, поради та FAQ — на сайті.
    menu: |
      <b>❓ Допомога</b>

      Вибери тему:
    create: |
      <b>🎨 Створення стікерів</b>

      1. Надішли /new, щоб створити пак
      2. Вибери тип: звичайний, відео або емодзі
      3. Надсилай фото, відео чи GIF
      4. Готово! Бот сам усе конвертує

      <b>Корисні команди:</b>
      • /clear — видалити фон з фото
      • /round — перетворити відео на відеоповідомлення (кружок)
      • /frame — форма відеостікера:
        └ lite, medium, rounded, square, circle

      <b>💡 Порада:</b> Надсилай PNG як <b>Файл</b> (📎), щоб зберегти прозорість. Режим «Фото» стискає зображення та прибирає її.
    manage: |
      <b>📁 Керування паками</b>

      <b>Команди:</b>
      • /packs — список твоїх паків
      • /delete — видалити стікер
      • /copy — скопіювати пак
      • /restore — відновити приховані паки
      • /original — знайти оригінал стікера
      • /about — інфо про пак та автора

      <b>Змінити емодзі:</b>
      Надішли стікер → надішли новий емодзі.
      Або надішли емодзі одразу після додавання.

      <b>Емодзі за замовчуванням:</b>
      /emoji 🔥 — усі нові стікери матимуть його.

      <b>У групах:</b>
      /ss (у відповідь на медіа) — швидке додавання до паку групи.

      <b>Інлайн-паки:</b>
      Твоя особиста колекція: надсилай збережені стікери, GIF, фото й відео в будь-якому чаті — напиши @ім'я_бота і вибери потрібне.
      • У стікери Telegram нічого не додається — усе зберігається в боті
      • Може містити стікери, фото, GIF, відео
      • Створи в /packs → вкладка «Інлайн»
      • Також є режим пошуку GIF (через Tenor)

      <b>Спільний доступ:</b>
      Натисни на пак → Спільний доступ → отримай посилання.
      Будь-хто з посиланням може додавати/видаляти стікери.
      Скинь посилання, щоб закрити доступ усім учасникам.

      <b>Опції паку:</b>
      Натисни на пак в /packs → перейменувати, буст, спільний доступ, видалити.
    catalog: |
      <b>🔍 Каталог</b>

      • /catalog — популярні паки
      • /publish — опублікувати свій пак
      • Оцінюй паки, щоб підтримати найкращі
    boost: |
      <b>⚡ Буст</b>

      • Без "${titleSuffix}" у назві
      • Пріоритетна обробка відео
      • Відео до 35 сек
      • Кілька стікерів одночасно

      <b>🎨 Адаптивні емодзі</b> — окремий тип паку в /new: емодзі змінюють колір під текст

      Отримати → /donate
    problems: |
      <b>❓ FAQ</b>

      <b>⚫ Фон став чорним?</b>
      Telegram прибирає прозорість, якщо надіслати як «Фото».
      → Надсилай PNG як <b>Файл</b> (📎 скріпка).

      <b>🔄 Зміни не видно?</b>
      Telegram кешує стікери. Зачекай ~1 годину або перезапусти застосунок.

      <b>📹 Відео не анімується?</b>
      Найімовірніше, незвичний формат. Спробуй конвертувати в MP4 або надіслати як файл замість відео.

      <b>🗑 Як видалити стікер?</b>
      Надішли /delete, потім натисни на стікер.

      <b>🤏 Стікер замалий?</b>
      Обріж картинку до квадрата (1:1) перед надсиланням.

      <b>🔗 Як прибрати "_by_fStikBot" з посилання?</b>
      Ніяк. Telegram вимагає цей суфікс, щоб визначити, яким ботом створено пак. Це правило платформи, а не наше.

      <b>💎 Потрібен Premium?</b>
      • Створювати паки: безкоштовно
      • Використовувати стікери: безкоштовно
      • Надсилати користувацькі емодзі: лише з Premium (правило Telegram)

      <b>Ще питання?</b> @StickLyUA
    btn:
