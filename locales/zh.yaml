---
language_name: '🇨🇳 简体中文'
name: fStik — 贴纸和表情
description:
  long: |
    用照片、视频和 GIF 制作贴纸和表情。无需手动转换，机器人会自动搞定。比 @Stickers 更简单。

    功能：
    • 管理贴纸包
    • 视频贴纸和自定义表情
    • 下载原始文件
    • 将贴纸/视频/GIF 转换为图片
    • 贴纸目录

    搜索贴纸：play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    用照片、视频、GIF 制作贴纸和表情。贴纸目录与搜索。🇺🇦
ratelimit: 操作太频繁了！
cmd:
