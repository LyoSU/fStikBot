      catalog_app_mini: '📱 Android 应用'
  guide:
    web: |
      <b>📖 fStikBot 使用指南</b>

      完整教程、技巧和常见问题请访问我们的网站。
    menu: |
      <b>❓ 帮助</b>

      请选择主题：
    create: |
      <b>🎨 制作贴纸</b>

      1. 发送 /new 创建贴纸包
      2. 选择类型：普通、视频或表情
      3. 发送照片、视频或 GIF
      4. 完成！机器人会自动转换一切

      <b>实用命令：</b>
      • /clear — 去除照片背景
      • /round — 把视频做成圆形视频消息
      • /frame — 视频贴纸的形状：
        └ lite, medium, rounded, square, circle

      <b>💡 提示：</b>以<b>文件</b>（📎）形式发送 PNG 可保留透明背景。“照片”模式会压缩图片并去掉透明度。
    manage: |
      <b>📁 管理贴纸包</b>

      <b>命令：</b>
      • /packs — 你的贴纸包列表
      • /delete — 删除贴纸
      • /copy — 复制贴纸包
      • /restore — 恢复已隐藏的贴纸包
      • /original — 查找贴纸原件
      • /about — 贴纸包和作者信息

      <b>更改表情：</b>
      发送贴纸 → 再发送新的表情。
      也可以在添加贴纸后立即发送表情。

      <b>默认表情：</b>
      /emoji 🔥 — 之后添加的所有贴纸都会使用这个表情。

      <b>在群组中：</b>
      /ss（回复媒体消息）— 快速添加到群组贴纸包。

      <b>内联贴纸包：</b>
      一种独立的贴纸包类型，可在任意聊天中通过 @机器人用户名 快速调用。
      • 并非真正的 Telegram 贴纸包，只保存在机器人中
      • 可以包含贴纸、照片、GIF 和视频
      • 在 /packs →“内联”标签页中创建
      • 还支持 GIF 搜索模式（基于 Tenor）

      <b>协作编辑（Co-edit）：</b>
      点击贴纸包 → 协作编辑 → 获取链接。
      任何拿到链接的人都可以添加或删除贴纸。
      重置链接即可移除所有编辑者。

      <b>贴纸包选项：</b>
      在 /packs 中点击贴纸包 → 重命名、助力、协作编辑、删除。
    catalog: |
      <b>🔍 目录</b>

      • /catalog — 热门贴纸包
      • /publish — 发布你的贴纸包
      • 给贴纸包评分，让优质贴纸包获得更多曝光
    boost: |
      <b>⚡ 助力</b>

      • 名称中不带“${titleSuffix}”
      • 视频优先处理
      • 视频最长 30 秒
      • 可将多个贴纸加入队列

      <b>自适应表情</b> — /new 中的独立按钮（颜色会随文字变化）

      获取 → /donate
    problems: |
      <b>❓ 常见问题</b>

      <b>⚫ 背景变黑了？</b>
      以“照片”形式发送时，Telegram 会去掉透明度。
      → 请以<b>文件</b>形式发送 PNG（📎 回形针）。

      <b>🔄 修改没有生效？</b>
      Telegram 会缓存贴纸。请等待约 1 小时或重启应用。

      <b>📹 视频不会动？</b>
      很可能是格式特殊。请尝试转换为 MP4，或以文件而非视频形式发送。

      <b>🗑 如何删除贴纸？</b>
      发送 /delete，然后点击要删除的贴纸。

      <b>🤏 贴纸太小？</b>
      发送前先把图片裁剪成正方形（1:1）。

      <b>🔗 如何去掉链接中的“_by_fStikBot”？</b>
      无法去掉。Telegram 要求使用此后缀来识别贴纸包由哪个机器人创建。这是平台规则，不是我们定的。

      <b>💎 需要 Premium 吗？</b>
      • 创建贴纸包：免费
      • 使用贴纸：免费
      • 发送自定义表情：仅限 Premium（Telegram 规则）

      <b>还有问题？</b> @fStikCommunity
