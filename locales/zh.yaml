    hint: '发送照片、视频、GIF 或贴纸，我会把它添加到 <a href="${link}">${title}</a>。'
  guide:
    web: |
      <b>📖 使用指南</b>

      1. /new — 创建贴纸包
      2. 发送照片、视频、GIF 或贴纸，直接发送整个相册也可以
      3. /packs — 查看贴纸包及其设置

      更多教程、技巧与常见问题请访问网站。
    menu: |
      <b>❓ 帮助</b>

      请选择主题：
    create: |
      <b>🎨 制作贴纸</b>

      1. 发送 /new 创建贴纸包
      2. 选择类型：普通贴纸、视频贴纸或表情
      3. 发送照片、视频或 GIF
      4. 完成！机器人会自动完成转换

      <b>实用命令：</b>
      • /clear — 去除照片背景
      • /round — 将视频转为圆形视频消息
      • /frame — 视频贴纸形状：
        └ lite, medium, rounded, square, circle

      <b>💡 提示：</b>以<b>文件</b>（📎）形式发送 PNG 可保留透明背景。“照片”模式会压缩图片并去除透明通道。
    manage: |
      <b>📁 管理贴纸包</b>

      <b>命令：</b>
      • /packs — 贴纸包列表
      • /delete — 删除贴纸
      • /copy — 复制贴纸包
      • /restore — 恢复已隐藏的贴纸包
      • /original — 查找贴纸来源
      • /about — 贴纸包与作者信息

      <b>更改对应表情：</b>
      发送贴纸 → 发送新的表情。
      也可以在添加贴纸后立即发送表情。

      <b>默认表情：</b>
      /emoji 🔥 — 后续添加的新贴纸都会使用该表情。

      <b>在群组中：</b>
      /ss（回复媒体消息）— 快速添加到群组贴纸包。

      <b>内联贴纸包：</b>
      你的私人收藏夹：在任意聊天中输入 @机器人用户名 并选择所需内容，即可发送已保存的贴纸、GIF、照片和视频。
      • 不会占用 Telegram 贴纸收藏 — 所有内容均保存在机器人中
      • 可包含贴纸、照片、GIF 和视频
      • 前往 /packs →“内联”标签页即可创建
      • 同样支持 GIF 搜索模式（基于 Tenor）

      <b>协作：</b>
      点击贴纸包 → 协作 → 获取链接。
      任何拿到链接的人都可以添加或删除贴纸。
      重置链接即可移除所有编辑者。

      <b>贴纸包选项：</b>
      在 /packs 中点击贴纸包 → 重命名、Boost、协作、删除。
    catalog: |
      <b>🔍 目录</b>

      • /catalog — 热门贴纸包
      • /publish — 发布你的贴纸包
      • 给贴纸包评分，让优质贴纸包获得更多曝光
    boost: |
      <b>⚡ Boost</b>

      • 标题不含“${titleSuffix}”
      • 视频优先排队处理
      • 视频最长支持 35 秒
      • 支持一次添加多个贴纸

      <b>🎨 自适应表情</b> — /new 中的专属类型：表情颜色会自动适配文字颜色

      获取方式 → /donate
    problems: |
      <b>❓ 常见问题</b>

      <b>⚫ 背景变黑了？</b>
      以“照片”形式发送时，Telegram 会自动去除透明背景。
      → 请以<b>文件</b>形式发送 PNG（📎 回形针图标）。

      <b>🔄 修改没有生效？</b>
      Telegram 会本地缓存贴纸。请等待约 1 小时或重启应用。

      <b>📹 视频贴纸不会动？</b>
      大概率是视频格式特殊。请尝试转换为 MP4，或以“文件”而非“视频”形式发送。

      <b>🗑 如何删除贴纸？</b>
      发送 /delete，然后点击想要删除的贴纸。

      <b>🤏 贴纸太小？</b>
      发送前请先将图片裁剪为正方形（1:1）。

      <b>🔗 如何去掉链接中的“_by_fStikBot”？</b>
      无法去除。Telegram 官方要求使用该后缀标识是由哪个机器人创建的贴纸包。这是平台规则，不是我们的限制。

      <b>💎 需要 Telegram Premium 吗？</b>
      • 创建贴纸包：免费
      • 发送和使用贴纸：免费
      • 发送自定义表情：仅限 Premium 用户（Telegram 平台限制）

      <b>还有其他疑问？</b> @fStikCommunity
