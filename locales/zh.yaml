description:
  long: |
    用照片、视频和 GIF 制作贴纸和表情。无需手动转换，机器人搞定一切。比 @Stickers 更简单。

    功能：
    • 贴纸包管理
    • 视频贴纸与自定义表情
    • 下载原文件
    • 将贴纸/视频/GIF 转为图片
    • 贴纸目录

    搜索贴纸：play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    用照片、视频和 GIF 制作贴纸与表情。贴纸目录与搜索。🇺🇦
ratelimit: 操作太频繁了！
