  guide:
    web: |
      <b>📖 Cara menggunakan fStikBot</b>

      Panduan lengkap, tips, dan FAQ ada di situs kami.
    menu: |
      <b>❓ Bantuan</b>

      Pilih topik:
    create: |
      <b>🎨 Membuat stiker</b>

      1. Kirim /new untuk membuat paket
      2. Pilih jenis: biasa, video, atau emoji
      3. Kirim foto, video, atau GIF
      4. Selesai! Bot mengonversi semuanya secara otomatis

      <b>Perintah berguna:</b>
      • /clear — hapus latar belakang foto
      • /round — ubah video menjadi video bulat
      • /frame — bentuk stiker video:
        └ lite, medium, rounded, square, circle

      <b>💡 Tips:</b> Kirim PNG sebagai <b>File</b> (📎) agar transparansinya tetap ada. Mode "Foto" mengompres dan menghilangkannya.
    manage: |
      <b>📁 Kelola paket</b>

      <b>Perintah:</b>
      • /packs — daftar paketmu
      • /delete — hapus stiker
      • /copy — salin paket
      • /restore — pulihkan paket yang disembunyikan
      • /original — cari stiker asli
      • /about — info paket dan pembuatnya

      <b>Ganti emoji:</b>
      Kirim stiker → kirim emoji baru.
      Atau kirim emoji tepat setelah menambahkan stiker.

      <b>Emoji default:</b>
      /emoji 🔥 — semua stiker baru akan memakai emoji ini.

      <b>Di grup:</b>
      /ss (sebagai balasan ke media) — tambah cepat ke paket grup.

      <b>Paket inline:</b>
      Jenis paket terpisah untuk akses cepat lewat @nama_bot di chat mana pun.
      • Bukan paket Telegram sungguhan — hanya tersimpan di bot
      • Bisa berisi stiker, foto, GIF, video
      • Buat di /packs → tab "Inline"
      • Ada juga mode pencarian GIF (lewat Tenor)

      <b>Edit bersama:</b>
      Ketuk paket → Edit bersama → dapatkan tautan.
      Siapa pun yang punya tautan bisa menambah/menghapus stiker.
      Setel ulang tautan untuk menghapus semua editor.

      <b>Opsi paket:</b>
      Ketuk paket di /packs → ganti nama, boost, edit bersama, hapus.
    catalog: |
      <b>🔍 Katalog</b>

      • /catalog — paket populer
      • /publish — publikasikan paketmu
      • Beri nilai pada paket untuk mempromosikan yang keren
    boost: |
      <b>⚡ Boost</b>

      • Tanpa "${titleSuffix}" di nama paket
      • Prioritas pemrosesan video
      • Video hingga 30 detik
      • Beberapa stiker sekaligus dalam antrean

      <b>Emoji adaptif</b> — tombol terpisah di /new (warnanya menyesuaikan teks)

      Dapatkan → /donate
    problems: |
      <b>❓ FAQ</b>

      <b>⚫ Latar belakang jadi hitam?</b>
      Telegram menghapus transparansi jika dikirim sebagai "Foto".
      → Kirim PNG sebagai <b>File</b> (📎 ikon klip kertas).

      <b>🔄 Perubahan tidak terlihat?</b>
      Telegram menyimpan cache stiker. Tunggu ~1 jam atau buka ulang aplikasinya.

      <b>📹 Video tidak bergerak?</b>
      Kemungkinan formatnya tidak biasa. Coba konversi ke MP4 atau kirim sebagai File, bukan Video.

      <b>🗑 Bagaimana cara menghapus stiker?</b>
      Kirim /delete, lalu ketuk stikernya.

      <b>🤏 Stiker terlalu kecil?</b>
      Potong gambar menjadi persegi (1:1) sebelum dikirim.

      <b>🔗 Bagaimana menghapus "_by_fStikBot" dari tautan?</b>
      Tidak bisa. Telegram mewajibkan akhiran ini untuk mengetahui bot mana yang membuat paket. Ini aturan platform, bukan aturan kami.

      <b>💎 Perlu Premium?</b>
      • Membuat paket: gratis
      • Memakai stiker: gratis
      • Mengirim emoji kustom: hanya Premium (aturan Telegram)

      <b>Masih ada pertanyaan?</b> @fStikCommunity
