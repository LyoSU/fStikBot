---
language_name: '🇮🇩 Bahasa Indonesia'
name: fStik — Stiker & Emoji
description:
  long: |
    Buat stiker dan emoji dari foto, video, dan GIF. Tanpa konversi manual — bot yang urus semuanya. Lebih mudah daripada @Stickers.

    Fitur:
    • Kelola paket
    • Stiker video & emoji kustom
    • Unduh berkas asli
    • Ubah stiker/video/GIF jadi gambar
    • Katalog stiker

    Cari stiker: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Buat stiker dan emoji dari foto, video, GIF. Katalog dan pencarian stiker. 🇺🇦
ratelimit: Terlalu sering!
