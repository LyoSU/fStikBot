      Halo ${groupTitle}! Aku bisa buat stiker dan emoji.

      Untuk menambahkan stiker ke paket grup, balas foto, video, GIF, atau stiker dengan /ss.
    catalog: |
      <b>🔍 Katalog stiker</b>

      Cari paket dengan kata kunci atau jelajahi yang populer.
      Beri penilaian untuk bantu orang lain menemukan paket keren.
