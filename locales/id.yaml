name: fStik — Stiker & Emoji
description:
  long: |
    Buat stiker dan emoji dari foto, video, dan GIF. Tanpa konversi manual — bot mengurus semuanya. Lebih mudah daripada @Stickers.

    Fitur:
    • Kelola paket dengan mudah
    • Stiker video & emoji kustom
    • Unduh file asli
    • Ubah stiker/video/GIF menjadi gambar
    • Katalog stiker

    Cari stiker: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Buat stiker dan emoji dari foto, video, GIF. Katalog dan pencarian stiker. 🇺🇦
ratelimit: Terlalu sering!
