  guide:
    web: |
      <b>📖 Cara kerja</b>

      1. /new — buat paket
      2. Kirim foto, video, GIF, atau stiker — bisa satu album sekaligus
      3. /packs — paketmu dan pengaturannya

      Panduan, tips, dan FAQ ada di situs web.
    menu: |
      <b>❓ Bantuan</b>

      Pilih topik:
    create: |
      <b>🎨 Membuat stiker</b>

      1. Kirim /new untuk membuat paket
      2. Pilih jenis: biasa, video, atau emoji
      3. Kirim foto, video, atau GIF
      4. Selesai! Bot akan mengonversi semuanya

      <b>Perintah berguna:</b>
      • /clear — hapus latar belakang foto
      • /round — ubah video jadi pesan video (bulat)
      • /frame — bentuk stiker video:
        └ lite, medium, rounded, square, circle

      <b>💡 Tip:</b> Kirim PNG sebagai <b>Berkas</b> (📎) agar transparansi terjaga. Mode "Foto" mengompres dan menghapus transparansi.
    manage: |
      <b>📁 Kelola paket</b>

      <b>Perintah:</b>
      • /packs — daftar paketmu
      • /delete — hapus stiker
      • /copy — salin paket
      • /restore — pulihkan paket tersembunyi
      • /original — cari asal stiker
      • /about — info paket dan pembuatnya

      <b>Ganti emoji:</b>
      Kirim stiker → kirim emoji baru.
      Atau kirim emoji tepat setelah menambahkan stiker.

      <b>Emoji default:</b>
      /emoji 🔥 — semua stiker baru akan memakai emoji ini.

      <b>Di grup:</b>
      /ss (balas media) — tambah cepat ke paket grup.

      <b>Paket inline:</b>
      Koleksi pribadimu: kirim stiker, GIF, foto, dan video tersimpan di chat mana pun — ketik @nama_bot lalu pilih yang kamu inginkan.
      • Tidak ada yang ditambahkan ke stiker Telegram — semuanya disimpan di bot
      • Bisa berisi stiker, foto, GIF, video
      • Buat di /packs → tab "Inline"
      • Ada juga mode pencarian GIF (lewat Tenor)

      <b>Edit bersama:</b>
      Ketuk paket → Edit bersama → dapatkan tautan.
      Siapa pun yang punya tautan bisa menambah/menghapus stiker.
      Setel ulang tautan untuk menghapus semua editor.

      <b>Opsi paket:</b>
      Ketuk paket di /packs → ubah nama, boost, edit bersama, hapus.
    catalog: |
      <b>🔍 Katalog</b>

      • /catalog — paket populer
      • /publish — publikasikan paketmu
      • Beri penilaian paket untuk bantu mempromosikan yang keren
    boost: |
      <b>⚡ Boost</b>

      • Tanpa "${titleSuffix}" di judul paket
      • Prioritas pemrosesan video
      • Video hingga 35 detik
      • Tambah beberapa stiker sekaligus

      <b>🎨 Emoji adaptif</b> — jenis paket terpisah di /new: warna emoji otomatis menyesuaikan teks

      Dapatkan → /donate
    problems: |
      <b>❓ FAQ</b>

      <b>⚫ Latar belakang jadi hitam?</b>
      Telegram menghapus transparansi jika dikirim sebagai "Foto".
      → Kirim PNG sebagai <b>Berkas</b> (📎 ikon klip).

      <b>🔄 Perubahan tidak muncul?</b>
      Telegram menyimpan cache stiker. Tunggu ~1 jam atau buka ulang aplikasi.

      <b>📹 Video tidak bergerak?</b>
      Kemungkinan formatnya tidak biasa. Coba konversi ke MP4 atau kirim sebagai Berkas, bukan Video.

      <b>🗑 Cara menghapus stiker?</b>
      Kirim /delete, lalu ketuk stikernya.

      <b>🤏 Stiker terlalu kecil?</b>
      Potong gambar jadi persegi (1:1) sebelum dikirim.

      <b>🔗 Cara menghapus "_by_fStikBot" dari tautan?</b>
      Tidak bisa. Telegram mewajibkan akhiran ini untuk menandai bot pembuat paket. Ini aturan platform, bukan aturan kami.

      <b>💎 Perlu Premium?</b>
      • Membuat paket: gratis
      • Memakai stiker: gratis
      • Mengirim emoji kustom: khusus Premium (aturan Telegram)

      <b>Punya pertanyaan lain?</b> @fStikCommunity
