  guide:
    web: |
      <b>📖 Ինչպես է սա աշխատում</b>

      1. /new — ստեղծիր փաթեթ
      2. Ուղարկիր լուսանկարներ, տեսանյութեր, GIF կամ ստիկերներ՝ նույնիսկ ամբողջ ալբոմով
      3. /packs — քո փաթեթները և դրանց կարգավորումները

      Ուղեցույցներ, խորհուրդներ և հաճախ տրվող հարցեր՝ կայքում։
    menu: |
      <b>❓ Օգնություն</b>

      Ընտրիր թեման՝
    create: |
      <b>🎨 Ստիկերների ստեղծում</b>

      1. Ուղարկիր /new՝ փաթեթ ստեղծելու համար
      2. Ընտրիր տեսակը՝ սովորական, տեսա կամ էմոջի
      3. Ուղարկիր լուսանկարներ, տեսանյութեր կամ GIF-եր
      4. Պատրաստ է։ Բոտն ամեն ինչ ինքն է փոխարկում

      <b>Օգտակար հրամաններ՝</b>
      • /clear — հեռացնել ֆոնը լուսանկարից
      • /round — տեսանյութից սարքել կլոր տեսահաղորդագրություն
      • /frame — տեսաստիկերի ձևը՝
        └ lite, medium, rounded, square, circle

      <b>💡 Խորհուրդ՝</b> PNG-ն ուղարկիր որպես <b>Ֆայլ</b> (📎), որ թափանցիկությունը պահպանվի։ «Լուսանկար» ռեժիմը սեղմում է նկարը և հեռացնում թափանցիկությունը։
    manage: |
      <b>📁 Փաթեթների կառավարում</b>

      <b>Հրամաններ՝</b>
      • /packs — քո փաթեթների ցանկը
      • /delete — ջնջել ստիկեր
      • /copy — պատճենել փաթեթ
      • /restore — վերադարձնել թաքցված փաթեթները
      • /original — գտնել ստիկերի բնօրինակը
      • /about — տեղեկություն փաթեթի և հեղինակի մասին

      <b>Փոխել էմոջին՝</b>
      Ուղարկիր ստիկերը → ուղարկիր նոր էմոջին։
      Կամ ուղարկիր էմոջին ավելացնելուց անմիջապես հետո։

      <b>Լռելյայն էմոջի՝</b>
      /emoji 🔥 — բոլոր նոր ստիկերները կստանան այս էմոջին։

      <b>Խմբերում՝</b>
      /ss (ի պատասխան մեդիաֆայլի) — արագ ավելացում խմբային փաթեթում։

      <b>Ինլայն փաթեթներ՝</b>
      Քո անձնական հավաքածուն՝ ուղարկիր պահված ստիկերներ, GIF-եր, լուսանկարներ և տեսանյութեր ցանկացած զրույցում — գրիր @բոտի_անունը և ընտրիր անհրաժեշտը։
      • Telegram-ի ստիկերներում ոչինչ չի ավելացվում՝ ամեն ինչ պահվում է բոտում
      • Կարող է պարունակել ստիկերներ, լուսանկարներ, GIF-եր, տեսանյութեր
      • Ստեղծիր /packs-ում → «Ինլայն» ներդիր
      • Կա նաև GIF-երի որոնման ռեժիմ (Tenor-ի միջոցով)

      <b>Համատեղ խմբագրում՝</b>
      Սեղմիր փաթեթի վրա → Համատեղ խմբագրում → ստացիր հղում։
      Հղումն ունեցող ցանկացած մարդ կարող է ավելացնել և ջնջել ստիկերներ։
      Վերակայիր հղումը՝ բոլոր խմբագիրներին հեռացնելու համար։

      <b>Փաթեթի կարգավորումներ՝</b>
      Սեղմիր փաթեթի վրա /packs-ում → վերանվանել, բուստ, համատեղ խմբագրում, ջնջել։
    catalog: |
      <b>🔍 Կատալոգ</b>

      • /catalog — հանրաճանաչ փաթեթներ
      • /publish — հրապարակել քո փաթեթը
      • Գնահատիր փաթեթները, որ լավերն առաջ գնան
    boost: |
      <b>⚡ Բուստ</b>

      • Անվանման մեջ առանց "${titleSuffix}"-ի
      • Տեսանյութերի առաջնահերթ մշակում
      • Տեսանյութեր մինչև 35 վրկ
      • Մի քանի ստիկեր միաժամանակ

      <b>🎨 Ադապտիվ էմոջիներ</b> — փաթեթի առանձին տեսակ /new-ում՝ էմոջիները փոխում են գույնը տեքստի գույնին համապատասխան

      Ստանալ → /donate
    problems: |
      <b>❓ Հաճախ տրվող հարցեր</b>

      <b>⚫ Ֆոնը սևացե՞լ է</b>
      Telegram-ը հեռացնում է թափանցիկությունը, եթե ուղարկում ես որպես «Լուսանկար»։
      → PNG-ն ուղարկիր որպես <b>Ֆայլ</b> (📎 ամրակ)։

      <b>🔄 Փոփոխությունները չե՞ն երևում</b>
      Telegram-ը քեշավորում է ստիկերները։ Սպասիր ~1 ժամ կամ վերագործարկիր հավելվածը։

      <b>📹 Տեսանյութը չի՞ շարժվում</b>
      Հավանաբար ձևաչափն անսովոր է։ Փորձիր փոխարկել MP4-ի կամ ուղարկիր որպես Ֆայլ՝ Տեսանյութի փոխարեն։

      <b>🗑 Ինչպե՞ս ջնջել ստիկերը</b>
      Ուղարկիր /delete, հետո սեղմիր ստիկերի վրա։

      <b>🤏 Ստիկերը շա՞տ փոքր է</b>
      Ուղարկելուց առաջ կտրիր նկարը քառակուսու (1:1)։

      <b>🔗 Ինչպե՞ս հեռացնել "_by_fStikBot"-ը հղումից</b>
      Ոչ մի կերպ։ Telegram-ը պահանջում է այս վերջածանցը՝ որոշելու, թե որ բոտն է ստեղծել փաթեթը։ Սա հարթակի կանոն է, ոչ թե մերը։

      <b>💎 Premium պե՞տք է</b>
      • Փաթեթներ ստեղծել՝ անվճար
      • Ստիկերներ օգտագործել՝ անվճար
      • Անհատական էմոջիներ ուղարկել՝ միայն Premium-ով (Telegram-ի կանոն)

      <b>Այլ հարցե՞ր կան</b> @fStikCommunity
