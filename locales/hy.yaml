      Ստիկերների փաթեթն անհասանելի է։ Հավանաբար այն ջնջվել է Telegram-ում։
    pack_full: |
      Փաթեթը լցված է (Telegram-ի սահմանաչափը լրացել է)։ Ջնջիր մի քանի ստիկեր և փորձիր նորից։
    not_pack_owner: |
      Այս փաթեթը պատկանում է այլ օգտատիրոջ՝ այն փոփոխել հնարավոր չէ։
    pack_name_taken: |
      Փաթեթի այս հասցեն արդեն զբաղված է։ Ընտրիր այլ անուն։
    pack_name_invalid: |
      Փաթեթի հասցեի ձևաչափը սխալ է։ Թույլատրվում են լատինական տառեր, թվեր և ընդգծման նշան (_)։
    invalid_sticker_format: |
      Ֆայլը ստիկեր լինել չի կարող՝ սխալ ձևաչափ կամ չափ։
    invalid_emoji: |
      Էմոջին սխալ է։ Ուղարկիր ստանդարտ Unicode էմոջի։
    rate_limited: |
      Telegram-ը խնդրում է սպասել՝ փորձիր նորից մի քանի վայրկյանից։
    cannot_reach_user: |
      Չեմ կարող գրել օգտատիրոջը՝ բոտն արգելափակված է, կամ զրույցն անհասանելի է։
  answerCbQuery:
    telegram: |
      Սխալ՝ ${error}
  file_too_big: |
    Ֆայլը չափազանց մեծ է (առավելագույնը՝ 20 ՄԲ)։
  download: |
    Չհաջողվեց ներբեռնել ֆայլը։ Փորձիր նորից։
  banned: |
    🚫 Մուտքն արգելված է։ Հարցեր → @ly_oBot
  access_denied: Մուտքն արգելված է
  unknown: |
    Ինչ-որ բան սխալ գնաց։ Փորձիր նորից։

    Չի՞ օգնում։ Գրիր @Ly_oBot-ին
  rate_limit: |
    ⏳ Չափազանց շատ հարցումներ։ Մի փոքր սպասիր և փորձիր նորից։
  rate_limit_seconds: |
    ⏳ Չափազանց շատ հարցումներ։ Սպասիր ${seconds} վայրկյան։
