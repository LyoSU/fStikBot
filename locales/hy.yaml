language_name: '🇦🇲 Հայերեն'
name: fStik — Ստիկերներ և էմոջի
description:
  long: |
    Ստեղծիր ստիկերներ և էմոջիներ լուսանկարներից, տեսանյութերից և GIF-երից։ Առանց ձեռքով փոխարկման՝ բոտն ամեն ինչ ինքն է անում։ Ավելի պարզ, քան @Stickers-ը։

    Հնարավորություններ՝
    • Փաթեթների կառավարում
    • Տեսաստիկերներ և անհատական էմոջիներ
    • Բնօրինակների ներբեռնում
    • Ստիկերի/տեսանյութի/GIF-ի փոխարկում նկարի
    • Ստիկերների կատալոգ

    Ստիկերների որոնում՝ play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Ստեղծիր ստիկերներ և էմոջիներ լուսանկարներից, տեսանյութերից, GIF-երից։ Ստիկերների կատալոգ և որոնում։ 🇺🇦
