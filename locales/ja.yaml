    hint: '写真・動画・GIF・ステッカーを送信すると、<a href="${link}">${title}</a> に追加します。'
  guide:
    web: |
      <b>📖 使い方</b>

      1. /new — パックを作成
      2. 写真、動画、GIF、ステッカーを送信（アルバムも可）
      3. /packs — パック一覧と設定

      詳しいガイドやヒント、よくある質問は公式サイトでご覧いただけます。
    menu: |
      <b>❓ ヘルプ</b>

      トピックを選択してください：
    create: |
      <b>🎨 ステッカーの作成</b>

      1. /new を送信してパックを作成
      2. 種類を選択：通常、動画、絵文字
      3. 写真、動画、GIFを送信
      4. 完了！変換はボットが自動で行います

      <b>便利なコマンド：</b>
      • /clear — 写真の背景を削除
      • /round — 動画を丸いビデオメッセージに変換
      • /frame — 動画ステッカーのフレーム：
        └ lite, medium, rounded, square, circle

      <b>💡 ヒント：</b>透過を維持するには、PNGを<b>ファイル</b>（📎）として送信してください。「写真」として送ると圧縮され、透過が失われます。
    manage: |
      <b>📁 パックの管理</b>

      <b>コマンド：</b>
      • /packs — パック一覧
      • /delete — ステッカーを削除
      • /copy — パックをコピー
      • /restore — 非表示のパックを復元
      • /original — ステッカーの元ファイルを検索
      • /about — パックと作者の情報

      <b>絵文字の変更：</b>
      ステッカーを送信 → 新しい絵文字を送信。
      または、ステッカー追加直後に絵文字を送信してください。

      <b>デフォルト絵文字：</b>
      /emoji 🔥 — 新しく追加するすべてのステッカーにこの絵文字が設定されます。

      <b>グループ内：</b>
      /ss（メディアへの返信）— グループパックにすばやく追加。

      <b>インラインパック：</b>
      あなた専用のコレクションです。保存したステッカー、GIF、写真、動画を、どのチャットでも @botname と入力して選ぶだけで送信できます。
      • Telegramのステッカーには追加されず、すべてボット内に保存されます
      • ステッカー、写真、GIF、動画を保存可能
      • /packs →「インライン」タブで作成
      • GIF検索モード（Tenor経由）も搭載

      <b>共同編集：</b>
      パックをタップ →「共同編集」→ リンクを取得。
      リンクを知っている人なら誰でもステッカーの追加・削除ができます。
      リンクをリセットすると、すべての共同編集者のアクセス権を削除できます。

      <b>パックのオプション：</b>
      /packs でパックをタップ → 名前変更、Boost、共同編集、削除。
    catalog: |
      <b>🔍 カタログ</b>

      • /catalog — 人気のパック
      • /publish — 自分のパックを公開
      • 評価をつけて素敵なパックを広めましょう
    boost: |
      <b>⚡ Boost</b>

      • パック名に「${titleSuffix}」が付かない
      • 動画の優先変換
      • 最長35秒の動画
      • 複数のステッカーを同時に追加

      <b>🎨 アダプティブ絵文字</b> — /new で作成できる専用パック：テキストの色に合わせて絵文字の色が変わります

      利用する → /donate
    problems: |
      <b>❓ よくある質問</b>

      <b>⚫ 背景が黒くなってしまう？</b>
      「写真」として送信すると、Telegramによって透過が削除されます。
      → PNGを<b>ファイル</b>（📎 クリップ）として送信してください。

      <b>🔄 変更が反映されない？</b>
      Telegramがステッカーをキャッシュしています。約1時間待つか、アプリを再起動してください。

      <b>📹 動画が動かない？</b>
      対応していない形式の可能性があります。MP4に変換するか、「動画」ではなく「ファイル」として送信してみてください。

      <b>🗑 ステッカーを削除するには？</b>
      /delete を送信し、削除したいステッカーをタップしてください。

      <b>🤏 ステッカーが小さすぎる？</b>
      送信前に画像を正方形（1:1）にトリミングしてください。

      <b>🔗 リンクから「_by_fStikBot」を削除できますか？</b>
      削除できません。どのボットで作成されたかを識別するため、Telegramの仕様で必須となっています。当ボットではなくプラットフォーム側のルールです。

      <b>💎 Premiumは必要ですか？</b>
      • パックの作成：無料
      • ステッカーの使用：無料
      • カスタム絵文字の送信：Premium限定（Telegramの仕様）

      <b>他にご質問がありますか？</b> @fStikCommunity
