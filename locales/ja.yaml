  guide:
    web: |
      <b>📖 fStikBot の使い方</b>

      詳しいガイド、ヒント、よくある質問は公式サイトでご覧いただけます。
    menu: |
      <b>❓ ヘルプ</b>

      トピックを選んでください：
    create: |
      <b>🎨 スタンプの作成</b>

      1. /new を送信してパックを作成します
      2. 種類を選びます：通常・動画・絵文字
      3. 写真・動画・GIF を送信します
      4. 完了！変換はボットが自動で行います

      <b>便利なコマンド：</b>
      • /clear — 写真の背景を削除
      • /round — 動画を丸いビデオメッセージに変換
      • /frame — 動画スタンプの形を設定：
        └ lite, medium, rounded, square, circle

      <b>💡 ヒント：</b>透過を保つには、PNG を<b>ファイル</b>（📎）として送信してください。「写真」として送ると圧縮され、透過が失われます。
    manage: |
      <b>📁 パックの管理</b>

      <b>コマンド：</b>
      • /packs — パックの一覧
      • /delete — スタンプを削除
      • /copy — パックをコピー
      • /restore — 非表示にしたパックを復元
      • /original — スタンプのオリジナルを探す
      • /about — パックと作者の情報

      <b>絵文字を変更するには：</b>
      スタンプを送信 → 新しい絵文字を送信。
      または、追加した直後に絵文字を送信してください。

      <b>デフォルトの絵文字：</b>
      /emoji 🔥 — 新しく追加するスタンプすべてにこの絵文字が設定されます。

      <b>グループでは：</b>
      /ss（メディアに返信）— グループパックにすばやく追加。

      <b>インラインパック：</b>
      あなた専用のコレクションです。保存したスタンプ・GIF・写真・動画を、どのチャットでも @ボット名 と入力して選ぶだけで送信できます。
      • Telegram のスタンプには何も追加されず、すべてボット内に保存されます
      • スタンプ・写真・GIF・動画を入れられます
      • /packs →「インライン」タブで作成します
      • GIF 検索モード（Tenor 経由）もあります

      <b>共同編集：</b>
      パックをタップ →「共同編集」→ リンクを取得。
      リンクを知っている人は誰でもスタンプを追加・削除できます。
      リンクをリセットすると、すべての編集者が削除されます。

      <b>パックのオプション：</b>
      /packs でパックをタップ → 名前の変更、ブースト、共同編集、削除。
    catalog: |
      <b>🔍 カタログ</b>

      • /catalog — 人気のパック
      • /publish — 自分のパックを公開
      • 評価をつけて素敵なパックを広めましょう
    boost: |
      <b>⚡ ブースト</b>

      • パック名に「${titleSuffix}」が付かない
      • 動画を優先的に処理
      • 最長 35 秒の動画
      • 複数のスタンプを同時に処理

      <b>🎨 アダプティブ絵文字</b> — /new で選べる独立したパックの種類：絵文字の色がテキストの色に合わせて変わります

      入手する → /donate
    problems: |
      <b>❓ よくある質問</b>

      <b>⚫ 背景が黒くなった？</b>
      「写真」として送信すると、Telegram が透過を削除します。
      → PNG を<b>ファイル</b>（📎 クリップ）として送信してください。

      <b>🔄 変更が反映されない？</b>
      Telegram はスタンプをキャッシュしています。1 時間ほど待つか、アプリを再起動してください。

      <b>📹 動画が動かない？</b>
      特殊な形式の可能性があります。MP4 に変換するか、「動画」ではなく「ファイル」として送信してみてください。

      <b>🗑 スタンプを削除するには？</b>
      /delete を送信し、削除したいスタンプをタップしてください。

      <b>🤏 スタンプが小さすぎる？</b>
      送信する前に画像を正方形（1:1）にトリミングしてください。

      <b>🔗 リンクから「_by_fStikBot」を消すには？</b>
      消すことはできません。どのボットで作成されたパックかを識別するため、Telegram がこのサフィックスを必須にしています。当ボットではなくプラットフォームのルールです。

      <b>💎 Premium は必要？</b>
      • パックの作成：無料
      • スタンプの使用：無料
      • カスタム絵文字の送信：Premium のみ（Telegram のルール）

      <b>ほかにご質問は？</b> @fStikCommunity
