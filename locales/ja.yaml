      こんにちは、${groupTitle}の皆さん！スタンプと絵文字を作成するボットです。

      グループパックにスタンプを追加するには、写真・動画・GIF・スタンプに返信して /ss を送信してください。
    catalog: |
      <b>🔍 スタンプカタログ</b>

      キーワードでパックを検索したり、人気のパックを見たりできます。
      評価をつけて、ほかの人が素敵なパックを見つけられるよう手伝ってください。
    search_catalog: |
      <b>🌐 パックカタログ</b>

