    <b>ブーストの特典：</b>
    • パック名に「<code>${titleSuffix}</code>」が付かない
    • 名前は最大 64 文字（通常は 35 文字）
    • 最長 35 秒の動画
    • 変換キューで優先
    • 複数のスタンプを同時に追加
    • 広告なし

