---
language_name: '🇯🇵 日本語'
name: fStik — スタンプ＆絵文字
description:
  long: |
    写真・動画・GIF からスタンプと絵文字を作成できます。手動での変換は不要で、ボットがすべて自動で処理します。@Stickers よりも簡単です。

    機能：
    • パックの管理
    • 動画スタンプとカスタム絵文字
    • オリジナルファイルのダウンロード
    • スタンプ・動画・GIF を画像に変換
    • スタンプカタログ

    スタンプを検索：play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    写真・動画・GIF からスタンプと絵文字を作成。スタンプのカタログと検索も。🇺🇦
ratelimit: 操作が速すぎます！
