---
language_name: '🇯🇵 日本語'
name: fStik — ステッカーと絵文字
description:
  long: |
    写真・動画・GIFからステッカーや絵文字を作成できます。手動での変換は不要。ボットがすべて自動で行います。@Stickers よりも簡単です。

    主な機能：
    • パックの管理
    • 動画ステッカーとカスタム絵文字
    • 元ファイルのダウンロード
    • ステッカー・動画・GIFの画像変換
    • ステッカーカタログ

    ステッカーを検索：play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    写真・動画・GIFからステッカーや絵文字を作成。ステッカーカタログと検索も利用できます。🇺🇦
ratelimit: 操作が早すぎます！
cmd:
  start:
    enter: |
      こんにちは、${name}さん！
      写真・動画・GIFからステッカーや絵文字を作成できます。

      💬 @fStikCommunity
    group: |
      こんにちは、${groupTitle}！ステッカーや絵文字を作成するボットです。

      グループパックにステッカーを追加するには、写真・動画・GIF・ステッカーに返信して /ss を送信してください。
    catalog: |
      <b>🔍 ステッカーカタログ</b>

      キーワードでパックを検索したり、人気のパックを閲覧したりできます。
      評価をつけて、みんなが素敵なパックを見つけられるよう協力してください。
    search_catalog: |
      <b>🌐 パックカタログ</b>

      他のユーザーのパックを見たり、自分のパックを公開したりできます：
    commands:
      ss: '➕ グループパックに追加'
      start: '📜 メニュー'
