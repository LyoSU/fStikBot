description:
  long: |
    Rasm, video va GIF-lardan stikerlar hamda emoji yarating. Qoʻlda konvertatsiya qilish shart emas — bot hammasini oʻzi bajaradi. @Stickers botidan ham osonroq.

    Imkoniyatlar:
    • Toʻplamlarni boshqarish
    • Video stikerlar va maxsus emoji
    • Asl fayllarni yuklab olish
    • Stiker/video/GIF-ni rasmga aylantirish
    • Stikerlar katalogi

    Stikerlarni qidirish: play.google.com/store/apps/details?id=app.fstik 🇺🇦
  short: |
    Rasm, video, GIF-lardan stiker va emoji yarating. Stikerlar katalogi va qidiruv. 🇺🇦
ratelimit: Juda tez-tez!
