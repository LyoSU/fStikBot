      <b>📖 Bu qanday ishlaydi</b>

      1. /new — toʻplam yarating
      2. Rasm, video, GIF yoki stikerlar yuboring — hatto butun albom bilan
      3. /packs — toʻplamlaringiz va ularning sozlamalari

      Qoʻllanmalar, maslahatlar va FAQ — saytda.
    menu: |
      <b>❓ Yordam</b>

      Mavzuni tanlang:
    create: |
      <b>🎨 Stikerlar yaratish</b>

      1. Toʻplam yaratish uchun /new yuboring
      2. Turini tanlang: oddiy, video yoki emoji
      3. Rasm, video yoki GIF yuboring
      4. Tayyor! Bot hammasini oʻzi konvertatsiya qiladi

      <b>Foydali buyruqlar:</b>
      • /clear — rasmdan fonni olib tashlash
      • /round — videodan dumaloq video yasash
      • /frame — video stiker shakli:
        └ lite, medium, rounded, square, circle

      <b>💡 Maslahat:</b> Shaffoflik saqlanishi uchun PNG-ni <b>Fayl</b> sifatida (📎) yuboring. «Rasm» rejimi uni siqib, shaffoflikni yoʻqotadi.
    manage: |
      <b>📁 Toʻplamlarni boshqarish</b>

      <b>Buyruqlar:</b>
      • /packs — toʻplamlaringiz roʻyxati
      • /delete — stikerni oʻchirish
      • /copy — toʻplamdan nusxa olish
      • /restore — yashirilgan toʻplamlarni qaytarish
      • /original — stikerning asl manbasini topish
      • /about — toʻplam va muallif haqida maʼlumot

      <b>Emojini oʻzgartirish:</b>
      Stiker yuboring → yangi emoji yuboring.
      Yoki qoʻshgandan soʻng darhol emoji yuboring.

      <b>Standart emoji:</b>
      /emoji 🔥 — barcha yangi stikerlar shu emojini oladi.

      <b>Guruhlarda:</b>
      /ss (mediaga javoban) — guruh toʻplamiga tez qoʻshish.

      <b>Inline toʻplamlar:</b>
      Shaxsiy kolleksiyangiz: saqlangan stiker, GIF, rasm va videolarni istalgan chatda yuboring — @bot_nomi deb yozing va keraklisini tanlang.
      • Telegram stikerlaringizga hech narsa qoʻshilmaydi — hammasi botda saqlanadi
      • Stiker, rasm, GIF va video saqlashi mumkin
      • /packs → «Inline» boʻlimida yarating
      • GIF qidiruv rejimi ham bor (Tenor orqali)

      <b>Birgalikda tahrirlash:</b>
      Toʻplamni bosing → Birgalikda tahrirlash → havola oling.
      Havolaga ega har kim stikerlarni qoʻshishi va oʻchirishi mumkin.
      Barcha muharrirlarni olib tashlash uchun havolani yangilang.

      <b>Toʻplam sozlamalari:</b>
      /packs roʻyxatida toʻplamni bosing → nomini oʻzgartirish, boost, birgalikda tahrirlash, oʻchirish.
    catalog: |
      <b>🔍 Katalog</b>

      • /catalog — mashhur toʻplamlar
      • /publish — oʻz toʻplamingizni eʼlon qilish
      • Zoʻr toʻplamlarni yuqoriga chiqarish uchun baho bering
    boost: |
      <b>⚡ Boost</b>

      • Nomda "${titleSuffix}" boʻlmaydi
      • Videolar navbatsiz qayta ishlanadi
      • 35 soniyagacha videolar
      • Bir vaqtda bir nechta stiker

      <b>🎨 Adaptiv emoji</b> — /new ichidagi alohida toʻplam turi: emojilar rangi matnga moslashadi

      Olish → /donate
    problems: |
      <b>❓ FAQ</b>

      <b>⚫ Fon qora boʻlib qoldimi?</b>
      «Rasm» sifatida yuborilsa, Telegram shaffoflikni olib tashlaydi.
      → PNG-ni <b>Fayl</b> sifatida yuboring (📎 qisqich).

      <b>🔄 Oʻzgarishlar koʻrinmayaptimi?</b>
      Telegram stikerlarni keshlaydi. Taxminan 1 soat kuting yoki ilovani qayta ishga tushiring.

      <b>📹 Video harakatlanmayaptimi?</b>
      Ehtimol, formati gʻalati. MP4 ga oʻgirib koʻring yoki Video emas, Fayl sifatida yuboring.

      <b>🗑 Stikerni qanday oʻchirish mumkin?</b>
      /delete yuboring, soʻng stikerni bosing.

      <b>🤏 Stiker juda kichikmi?</b>
      Yuborishdan oldin rasmni kvadrat (1:1) shaklida qirqing.

      <b>🔗 Havoladan "_by_fStikBot" ni qanday olib tashlash mumkin?</b>
      Iloji yoʻq. Telegram toʻplam qaysi bot tomonidan yaratilganini aniqlash uchun bu qoʻshimchani talab qiladi. Bu bizning emas, platformaning qoidasi.

      <b>💎 Premium kerakmi?</b>
      • Toʻplam yaratish: bepul
      • Stikerlardan foydalanish: bepul
      • Maxsus emoji yuborish: faqat Premium (Telegram qoidasi)

      <b>Yana savollar bormi?</b> @fStikCommunity
